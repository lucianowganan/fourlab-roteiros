<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendas · FourLab</title>
<meta name="description" content="Painel FourLab para atletas e parceiros: roteiros de conteúdo, vendas do cupom e perfil em um só lugar.">
<meta name="theme-color" content="#140e10">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="FourLab">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FourLab">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Painel dos atletas FourLab">
<meta property="og:description" content="Seus roteiros, suas vendas e seu cupom em um só lugar.">
<meta property="og:url" content="https://atleta.fourlabnutrition.com.br/">
<meta property="og:image" content="https://atleta.fourlabnutrition.com.br/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Painel dos atletas FourLab">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://atleta.fourlabnutrition.com.br/assets/og-image.jpg"><link rel="stylesheet" href="shared.css"></head><body>
<div class="shell" id="appShell"><div id="sidebarMount"></div>
<main id="main"><div class="empty-state"><span class="loader" style="border-top-color:var(--orange);border-color:rgba(0,0,0,0.1);"></span></div></main></div>
<div id="modalBg" class="modal-bg"><div id="modalBox" class="modal-box"></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
let athletes = [], vendasMensais = [], ym = monthKey(todayISO()), atletaSel = '';
// vendas ao vivo da Yampi: aoVivo[ym][athleteId] = {valorVendido, comissaoMes, numeroPedidos}
const aoVivo = {}; let carregandoEquipe = false;

function atletaById(id){ return athletes.find(a=>a.id===id); }
function comCupom(){ return athletes.filter(a=>a.cupomYampi); }

// Busca na Yampi: primeiro o mês escolhido e o anterior (números do topo), depois os outros 4 meses do gráfico
async function buscarMeses(meses){
  const tarefas = []; meses.forEach(m=>{ aoVivo[m] = {}; comCupom().forEach(a=> tarefas.push([m, a])); });
  await emLotes(tarefas, 4, async ([m, a])=>{
    try{ aoVivo[m][a.id] = await buscarVendasYampi(a.cupomYampi, m, a.descontoCupomPct, a.comissaoPct); }
    catch(err){ console.warn('Yampi', a.name, m, err); }
  });
}
async function carregarEquipeAoVivo(){
  const principais = [ym, addMonths(ym,-1)].filter(m=> !aoVivo[m]);
  if(principais.length){ carregandoEquipe = true; render(); await buscarMeses(principais); carregandoEquipe = false; render(); }
  const resto = [2,3,4,5].map(i=> addMonths(ym,-i)).filter(m=> !aoVivo[m]);
  if(resto.length){ await buscarMeses(resto); render(); }
}

/* ---------- Extrato mensal de pagamentos (só consulta): comissão (mín. R$ 100, acumula) + fee ---------- */
const relat = {}; let relMes = addMonths(monthKey(todayISO()), -1), relCarregado = false, feesCad = [];
const fechado = (m)=> m < monthKey(todayISO());   // o mês fecha no dia 1 do mês seguinte
async function calcularRelatorio(){
  const [f] = await Promise.all([carregarFees()]); feesCad = f.cadastros;
  const gente = athletes.filter(a=> (a.recebeComissao && a.cupomYampi) || feesCad.some(c=>c.athlete_id===a.id));
  for(const a of gente){
    if(a.recebeComissao && a.cupomYampi) relat[a.id] = await historicoComissao(a, {pagamentos:[]});
    desenharRelatorio();
  }
  relCarregado = true; desenharRelatorio();
}
// Linhas do mês escolhido: quanto pagar de comissão + fee. Quem tem fee recebe a comissão do mês inteira (sem mínimo).
function linhasRelatorio(m){
  return athletes.map(a=>{
    const fee = feesCad.find(c=>c.athlete_id===a.id), h = relat[a.id], l = h && h.linhas.find(x=>x.ym===m);
    if(!fee && !(a.recebeComissao && a.cupomYampi)) return null;
    const comissao = !l ? 0 : fee ? l.comissao_mes : l.a_pagar, valorFee = fee ? Number(fee.fee_valor||0) : 0;
    return { a, l, fee, comissao, valorFee, total: comissao + valorFee, doMes: l ? l.comissao_mes : 0, acumulado: l && !fee ? l.saldo_total : 0, faltam: l && !fee && !l.a_pagar ? Math.max(0, META_PAGAMENTO_COMISSAO - l.saldo_total) : 0, carregando: a.recebeComissao && a.cupomYampi && !h };
  }).filter(Boolean).sort((x,y)=> y.total - x.total);
}
function blocoRelatorioHtml(){
  if(!athletes.some(a=> (a.recebeComissao && a.cupomYampi))  && !feesCad.length && relCarregado) return '';
  const rows = linhasRelatorio(relMes), pagar = rows.filter(r=> r.total > 0 && !r.carregando), total = pagar.reduce((t,r)=> t+r.total, 0), fech = fechado(relMes);
  return `<div class="panel"><div class="card-head"><div><h2>Extrato de pagamentos — ${fmtMonthLabel(relMes)}</h2>
      <div class="desc">${fech ? `Fechado em 01/${addMonths(relMes,1).slice(5,7)}. Comissão a partir de ${fmtBRL(META_PAGAMENTO_COMISSAO)} (abaixo disso acumula pro mês seguinte) + fee mensal.` : `Mês em andamento — fecha em 01/${addMonths(relMes,1).slice(5,7)}. Os valores podem mudar até lá.`}
        ${fech && relCarregado ? ` <strong style="color:var(--ink);">${pagar.length} a pagar · ${fmtBRL(total)}</strong>` : ''}</div></div>
      <div class="row" style="gap:8px;"><input type="month" id="relMes" value="${relMes}" max="${monthKey(todayISO())}" style="width:auto; background:#fff;">
        ${fech ? '<button class="btn btn-outline btn-sm" id="relPdf">Exportar PDF</button>' : ''}</div></div>
    <div style="overflow-x:auto;"><table><thead><tr><th>Nome</th><th>Chave PIX</th><th style="text-align:right;">Comissão do mês</th><th style="text-align:right;">Acumulado</th><th style="text-align:right;">Fee</th><th style="text-align:right;">A pagar</th><th>Situação</th></tr></thead><tbody>
    ${rows.map(r=>`<tr style="${fech && r.total > 0 && !r.carregando ? 'background:var(--orange-soft);' : ''}"><td><div class="cell-person">${avatarHtml(r.a.name,'sm')}<div><strong>${escHtml(r.a.name)}</strong><div class="sub">${escHtml(r.a.team||'')}</div></div></div></td>
      <td>${r.a.pixKey ? `<span class="chip static">${ICONS.pix} ${escHtml(r.a.pixKey)}</span>` : '<span class="status-dot status-bad">sem chave</span>'}</td>
      <td style="text-align:right;">${r.carregando ? '…' : fmtBRL(r.doMes)}</td><td style="text-align:right;">${r.carregando ? '…' : r.fee ? '—' : fmtBRL(r.acumulado)}</td><td style="text-align:right;">${r.fee ? fmtBRL(r.valorFee) : '—'}</td>
      <td style="text-align:right; font-weight:800; ${fech && r.total > 0 ? 'color:var(--orange);' : ''}">${r.carregando ? '…' : fmtBRL(r.total)}</td>
      <td>${r.carregando ? '<span class="loader" style="width:12px;height:12px;border-top-color:var(--orange);border-color:rgba(0,0,0,0.08);"></span>' : !fech ? '<span class="status-dot status-wait">Em andamento</span>' : r.total > 0 ? '<span class="status-dot" style="color:var(--orange); font-weight:800;">A pagar</span>' : `<span class="status-dot status-wait">Acumulando · faltam ${fmtBRL(r.faltam)}</span>`}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function desenharRelatorio(){
  const el = document.getElementById('blocoRelatorio'); if(!el) return;
  el.innerHTML = blocoRelatorioHtml();
  const m = document.getElementById('relMes'); if(m) m.onchange = (e)=>{ if(e.target.value){ relMes = e.target.value; desenharRelatorio(); } };
  const p = document.getElementById('relPdf'); if(p) p.onclick = exportarRelatorioPdf;
}
// PDF só com quem tem valor a pagar (os demais ficam só no painel)
function exportarRelatorioPdf(){
  const rows = linhasRelatorio(relMes).filter(r=> r.total > 0 && !r.carregando); if(!rows.length){ toast('Ninguém a pagar neste mês'); return; }
  const w = window.open('', '_blank');
  w.document.write(`<html><head><meta charset="utf-8"><title>Pagamentos ${fmtMonthLabel(relMes)}</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#1a1315}h1{font-size:20px;margin:0 0 4px}p{color:#666;font-size:12px;margin:0 0 16px}table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:8px 6px;border-bottom:1px solid #ddd;text-align:left}th:nth-child(n+3),td:nth-child(n+3){text-align:right}tfoot td{font-weight:bold;border-top:2px solid #1a1315}</style></head><body>
    <h1>FourLab — Pagamentos de ${fmtMonthLabel(relMes)}</h1><p>Fechado em 01/${addMonths(relMes,1).slice(5,7)}. Só quem atingiu o valor mínimo ou recebe fee.</p>
    <table><thead><tr><th>Nome</th><th>Chave PIX</th><th>Comissão</th><th>Fee</th><th>Total</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${escHtml(r.a.name)}</td><td>${escHtml(r.a.pixKey||'sem chave')}</td><td>${fmtBRL(r.comissao)}</td><td>${fmtBRL(r.valorFee)}</td><td>${fmtBRL(r.total)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4">Total</td><td>${fmtBRL(rows.reduce((t,r)=>t+r.total,0))}</td></tr></tfoot></table>
    <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}
// total do mês: usa dados ao vivo quando já carregados, senão o histórico salvo (vendas_mensais)
function totalMes(mes, campo){
  const mapa = {valor_vendido:'valorVendido', comissao_mes:'comissaoMes', numero_pedidos:'numeroPedidos'};
  if(aoVivo[mes] && Object.keys(aoVivo[mes]).length){
    return Object.entries(aoVivo[mes]).reduce((s,[id,d])=>{
      if(campo==='comissao_mes' && !atletaById(id)?.recebeComissao) return s;
      return s + Number(d[mapa[campo]]||0); }, 0);
  }
  return vendasMensais.filter(v=>v.ym===mes && (campo!=='comissao_mes' || atletaById(v.athlete_id)?.recebeComissao)).reduce((s,v)=> s + Number(v[campo]||0), 0);
}
function vendedoresMes(mes){
  if(aoVivo[mes] && Object.keys(aoVivo[mes]).length) return Object.entries(aoVivo[mes]).filter(([,d])=>Number(d.valorVendido)>0).map(([id,d])=>({athlete_id:id, valor_vendido:Number(d.valorVendido)}));
  return vendasMensais.filter(v=>v.ym===mes && Number(v.valor_vendido)>0).map(v=>({athlete_id:v.athlete_id, valor_vendido:Number(v.valor_vendido)}));
}

function viewVendas(){
  const cupons = comCupom(), comissionados = athletes.filter(a=>a.recebeComissao);
  const prevYM = addMonths(ym, -1);
  const doMes = vendedoresMes(ym).sort((a,b)=> b.valor_vendido - a.valor_vendido);
  const maxV = doMes.length ? doMes[0].valor_vendido : 1;
  // histórico pro gráfico: vendas_mensais + meses carregados ao vivo
  const serie = vendasMensais.filter(v=> !(aoVivo[v.ym] && Object.keys(aoVivo[v.ym]).length));
  Object.keys(aoVivo).forEach(m=> serie.push({ym:m, valor_vendido: totalMes(m,'valor_vendido')}));
  const loader = carregandoEquipe ? ' <span class="loader" style="width:10px;height:10px;border-top-color:var(--orange);border-color:rgba(0,0,0,0.08);"></span>' : '';
  const kpi = (label, cur, prev, fmt, color)=> `<div class="card kpi"><div class="kpi-label">${label}${loader}</div><div class="kpi-value" ${color?`style="color:${color};"`:''}>${fmt(cur)}</div>
      <div class="kpi-foot">${deltaHtml(cur, prev)}<span>vs. mês anterior</span></div></div>`;

  return `
  <div class="page-head">
    <div><h1>Vendas por cupom</h1>
      <div class="sub">${cupons.length} com cupom Yampi · <strong style="color:var(--ink);">${comissionados.length} com comissão</strong> · ${fmtMonthLabel(ym)}</div></div>
    <div class="input-ic"><span class="ic">${ICONS.calendar}</span><input type="month" id="vendasMesInput" value="${ym}" style="width:auto; background:#fff;"></div>
  </div>

  <div class="grid-4" style="margin-bottom:18px;">
    ${kpi('Vendido com cupons', totalMes(ym,'valor_vendido'), totalMes(prevYM,'valor_vendido'), fmtBRLSplit)}
    ${kpi('Comissões geradas', totalMes(ym,'comissao_mes'), totalMes(prevYM,'comissao_mes'), fmtBRLSplit, 'var(--orange)')}
    ${kpi('Pedidos com cupom', totalMes(ym,'numero_pedidos'), totalMes(prevYM,'numero_pedidos'), fmtNum)}
    ${kpi('Quem vendeu no mês', doMes.length, vendedoresMes(prevYM).length, fmtNum)}
  </div>

  <div class="bento">
    <div class="card span-8">
      <div class="card-head"><div class="card-title-ic"><span class="ic-bubble">${ICONS.acompanhamento}</span><div><h2>Vendas totais por mês</h2><div class="desc">Soma de todos os cupons · últimos 6 meses</div></div></div></div>
      ${barrasMensaisHtml(serie, ym, 6)}
    </div>
    <div class="card span-4">
      <div class="card-head"><div><h2>Ranking do mês</h2><div class="desc">Clique pra abrir o painel individual</div></div><span class="ic-bubble">${ICONS.trend}</span></div>
      ${doMes.length ? doMes.slice(0,7).map((v,i)=>{ const a = atletaById(v.athlete_id); const nome = a ? a.name : '(removido)';
        return `<div data-pick="${v.athlete_id}" style="display:flex; align-items:center; gap:10px; padding:8px 6px; border-radius:12px; cursor:pointer;" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
          <span style="width:16px; font-size:11px; font-weight:800; color:var(--muted);">${i+1}</span>${avatarHtml(nome,'sm')}
          <div style="flex:1; min-width:0;"><div style="display:flex; justify-content:space-between; gap:6px; font-size:12.5px;"><strong style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escHtml(nome)}</strong><span style="font-weight:700; white-space:nowrap;">${fmtBRL(v.valor_vendido)}</span></div>
            <div class="progress" style="height:6px; margin-top:5px; border:none;"><div style="width:${v.valor_vendido/maxV*100}%;"></div></div></div></div>`; }).join('')
        : `<div class="empty-state" style="padding:24px;">${carregandoEquipe ? 'Buscando vendas na Yampi...' : 'Nenhuma venda neste mês.'}</div>`}
    </div>
  </div>

  <div id="blocoRelatorio"></div>

  <div class="panel">
    <div class="row" style="justify-content:space-between;">
      <div><h2>Painel individual</h2><div class="desc" style="margin-bottom:0;">Pedidos em tempo real da Yampi para o cupom selecionado.</div></div>
      <select id="vendasAtletaSelect" style="width:auto; min-width:min(260px, 100%); max-width:100%;">
        <option value="">— Selecione um cupom —</option>
        ${cupons.map(a=>`<option value="${a.id}" ${a.id===atletaSel?'selected':''}>${escHtml(a.name)} · ${escHtml(a.cupomYampi)}${a.recebeComissao?' · comissão':''}</option>`).join('')}
      </select>
    </div>
    ${!cupons.length ? '<div style="color:var(--muted); font-size:12px; margin-top:10px;">Nenhum cupom Yampi cadastrado ainda.</div>' : ''}
  </div>
  <div id="vendasEquipeDashboard"></div>`;
}
function disparar(){
  const a = athletes.find(x=>x.id===atletaSel);
  const box = document.getElementById('vendasEquipeDashboard');
  if(!a || !a.cupomYampi){ box.innerHTML = ''; return; }
  carregarDashboardVendas(a.cupomYampi, ym, a.descontoCupomPct, a.comissaoPct, 'vendasEquipeDashboard', {titulo:`Vendido por ${a.name}`, semComissao:!a.recebeComissao});
}
function render(){
  document.getElementById('main').innerHTML = viewVendas();
  document.getElementById('vendasAtletaSelect').onchange = (e)=>{ atletaSel = e.target.value; disparar(); };
  document.getElementById('vendasMesInput').onchange = (e)=>{ if(!e.target.value) return; ym = e.target.value; render(); carregarEquipeAoVivo(); };
  document.querySelectorAll('[data-pick]').forEach(el=> el.onclick = ()=>{
    atletaSel = el.dataset.pick; document.getElementById('vendasAtletaSelect').value = atletaSel; disparar();
    document.getElementById('vendasEquipeDashboard').scrollIntoView({behavior:'smooth'});
  });
  if(atletaSel) disparar();
  desenharRelatorio();
}
(async function start(){
  const auth = await guardStaff('vendas'); if(!auth) return;
  const [{ data }, { data: vm }] = await Promise.all([
    sb.from('athletes').select('*').order('team').order('name'),
    sb.from('vendas_mensais').select('*'),
  ]);
  athletes = (data||[]).map(mapAthleteFromDB);
  vendasMensais = vm || [];
  render();
  carregarEquipeAoVivo().then(calcularRelatorio);
})();
</script></body></html>
