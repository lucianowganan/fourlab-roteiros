<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline — FourLab Roteiros</title><link rel="stylesheet" href="shared.css"></head><body>
<div class="shell" id="appShell"><div id="sidebarMount"></div>
<main id="main" style="max-width:1400px;"><div class="empty-state"><span class="loader" style="border-top-color:var(--orange);border-color:rgba(0,0,0,0.1);"></span></div></main></div>
<div id="modalBg" class="modal-bg"><div id="modalBox" class="modal-box"></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
/* Pipeline interno (CRM + kanban). Cada card é uma tarefa na tabela crm_cards.
   Cards do tipo "Conteúdo" podem estar ligados a um post (entries) do mês. */
const STAGES = [
  {id:'a_fazer', label:'A fazer', ic:'◌', bg:'#efebe6', fg:'var(--ink-2)'},
  {id:'andamento', label:'Em andamento', ic:'◎', bg:'#fde0ea', fg:'var(--pink)'},
  {id:'aguardando', label:'Aguardando atleta', ic:'◷', bg:'#f1e3f0', fg:'var(--purple)'},
  {id:'concluido', label:'Concluído', ic:'✓', bg:'#dbf3e4', fg:'var(--green)'},
];
const TIPOS = ['Conteúdo','Acompanhamento','Envio de produto','Pagamento','Contrato','Outro'];
const TIPO_COR = {'Conteúdo':'var(--orange)','Acompanhamento':'var(--purple)','Envio de produto':'#1d4ed8','Pagamento':'var(--green)','Contrato':'var(--pink)','Outro':'var(--muted)'};

const State = { cards:[], athletes:[], entries:[], ym: monthKey(todayISO()), view:'kanban', tipo:'Todos', busca:'', athlete:'', tabelaOk:true };

function athleteById(id){ return State.athletes.find(a=>a.id===id); }
function mapCard(r){ return { id:r.id, titulo:r.titulo||'', tipo:r.tipo||'Outro', stage:r.stage||'a_fazer', prioridade:r.prioridade||'media',
  athleteId:r.athlete_id||'', entryId:r.entry_id||'', dueDate:r.due_date||'', notas:r.notas||'', position:r.position||0, createdAt:r.created_at }; }
function cardPayload(c){ return { titulo:c.titulo, tipo:c.tipo, stage:c.stage, prioridade:c.prioridade, athlete_id:c.athleteId||null,
  entry_id:c.entryId||null, due_date:c.dueDate||null, notas:c.notas, position:c.position||0 }; }

async function carregar(){
  const { data, error } = await sb.from('crm_cards').select('*').order('position').order('created_at');
  if(error){ console.error(error); State.tabelaOk = false; State.cards = []; return; }
  State.tabelaOk = true;
  State.cards = (data||[]).map(mapCard);
}
async function carregarEntriesDoMes(){
  const { data: cyc } = await sb.from('cycles').select('id').eq('ym', State.ym).maybeSingle();
  if(!cyc){ State.entries = []; return; }
  const { data } = await sb.from('entries').select('*').eq('cycle_id', cyc.id);
  State.entries = data || [];
}

function cardsFiltrados(){
  const q = State.busca.trim().toLowerCase();
  return State.cards.filter(c=>{
    if(State.tipo!=='Todos' && c.tipo!==State.tipo) return false;
    if(State.athlete && c.athleteId!==State.athlete) return false;
    if(q){ const a = athleteById(c.athleteId); if(![c.titulo, c.notas, a?.name, a?.team].some(v=>(v||'').toLowerCase().includes(q))) return false; }
    return true;
  });
}

function kcardHtml(c){
  const a = athleteById(c.athleteId);
  const late = c.dueDate && c.dueDate < todayISO() && c.stage!=='concluido';
  const prioLabel = {alta:'Urgente', media:'Média', baixa:'Baixa'}[c.prioridade] || 'Média';
  return `<div class="kcard" draggable="true" data-card="${c.id}">
    <div class="k-meta"><span style="width:8px; height:8px; border-radius:50%; background:${TIPO_COR[c.tipo]||'var(--muted)'};"></span>${escHtml(c.tipo)}
      <span class="prio prio-${c.prioridade}" style="margin-left:auto;">${ICONS.flag.replace('width="18" height="18"','width="11" height="11"')} ${prioLabel}</span></div>
    <div class="k-title">${escHtml(c.titulo)}</div>
    ${a ? `<div class="k-sub">${escHtml(a.name)} · ${escHtml(a.team)}</div>` : ''}
    ${c.dueDate ? `<span class="k-due ${late?'late':''}">${ICONS.calendar.replace('width="18" height="18"','width="12" height="12"')} ${late?'Atrasado · ':'Prazo: '}${fmtDateBR(c.dueDate)}</span>` : ''}
    <div class="k-foot">
      <span>${a ? avatarHtml(a.name,'sm') : ''}</span>
      <span class="row" style="gap:10px;">${c.notas ? `<span title="Tem anotações" style="display:inline-flex; align-items:center; gap:3px;">${ICONS.chat.replace('width="18" height="18"','width="13" height="13"')}</span>` : ''}
        ${c.entryId ? '<span title="Ligado a um post do mês">🔗 post</span>' : ''}
        ${c.createdAt ? `<span>${new Date(c.createdAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</span>` : ''}</span>
    </div></div>`;
}

function viewKanban(lista){
  return `<div class="kanban">${STAGES.map(s=>{
    const cs = lista.filter(c=>c.stage===s.id).sort((a,b)=> (a.position-b.position) || String(a.dueDate||'9').localeCompare(String(b.dueDate||'9')));
    return `<div class="kcol" data-stage="${s.id}">
      <div class="kcol-head"><span class="kcol-pill" style="background:${s.bg}; color:${s.fg};">${s.ic} ${s.label} <span class="count">${cs.length}</span></span></div>
      ${cs.map(kcardHtml).join('')}
      <button class="k-add" data-add-stage="${s.id}">+ Nova tarefa</button>
    </div>`; }).join('')}</div>`;
}
function viewLista(lista){
  const ordem = STAGES.map(s=>s.id);
  lista = lista.slice().sort((a,b)=> ordem.indexOf(a.stage)-ordem.indexOf(b.stage) || String(a.dueDate||'9').localeCompare(String(b.dueDate||'9')));
  return `<div class="panel" style="overflow-x:auto;"><table><thead><tr><th>Tarefa</th><th>Atleta</th><th>Tipo</th><th>Etapa</th><th>Prioridade</th><th>Prazo</th><th></th></tr></thead><tbody>
    ${lista.map(c=>{ const a = athleteById(c.athleteId), s = STAGES.find(x=>x.id===c.stage)||STAGES[0];
      const late = c.dueDate && c.dueDate < todayISO() && c.stage!=='concluido';
      return `<tr><td><strong>${escHtml(c.titulo)}</strong></td>
        <td>${a ? `<div class="cell-person">${avatarHtml(a.name,'sm')}<div>${escHtml(a.name)}<div class="sub">${escHtml(a.team)}</div></div></div>` : '<span style="color:var(--muted);">—</span>'}</td>
        <td><span class="status-dot" style="color:${TIPO_COR[c.tipo]};"><span style="color:var(--ink);">${escHtml(c.tipo)}</span></span></td>
        <td><span class="kcol-pill" style="background:${s.bg}; color:${s.fg}; padding:4px 10px; font-size:11.5px;">${s.label}</span></td>
        <td><span class="prio prio-${c.prioridade}">${{alta:'Urgente',media:'Média',baixa:'Baixa'}[c.prioridade]}</span></td>
        <td style="${late?'color:var(--red); font-weight:700;':''}">${c.dueDate?fmtDateBR(c.dueDate):'—'}</td>
        <td style="text-align:right;"><button class="icon-btn" data-card-open="${c.id}">${ICONS.arrow}</button></td></tr>`; }).join('')}
    ${!lista.length ? '<tr><td colspan="7"><div class="empty-state">Nenhuma tarefa.</div></td></tr>' : ''}
  </tbody></table></div>`;
}

function viewPipeline(){
  if(!State.tabelaOk) return `<div class="page-head"><div><h1>Pipeline</h1></div></div>
    <div class="panel"><div class="empty-state"><div class="big">🛠️</div><strong>A tabela <code>crm_cards</code> ainda não existe no Supabase.</strong><br>
    Rode o arquivo <code>migrations/2026-09-26_ux_redesign.sql</code> no SQL Editor do Supabase e recarregue a página.</div></div>`;
  const lista = cardsFiltrados();
  const ativos = new Set(State.entries.map(e=>e.athlete_id)).size;
  const postados = State.entries.filter(e=>e.postou==='sim').length;
  const abertas = State.cards.filter(c=>c.stage!=='concluido').length;
  const atrasadas = State.cards.filter(c=>c.stage!=='concluido' && c.dueDate && c.dueDate < todayISO()).length;
  const stat = (ic, valor, label, extra)=> `<div class="card kpi" style="padding:18px;"><div class="row" style="justify-content:space-between;"><span class="ic-bubble" style="background:var(--ink); color:#fff; border-color:var(--ink); border-radius:12px;">${ic}</span>${extra||''}</div>
    <div class="kpi-value" style="font-size:26px; margin-top:14px;">${valor}</div><div class="kpi-label" style="margin-top:2px;">${label}</div></div>`;
  const semCard = State.entries.filter(e=> !State.cards.some(c=>c.entryId===e.id)).length;

  return `
  <div class="page-head">
    <div><h1>Pipeline <span class="soft">interno</span></h1><div class="sub">Acompanhe cada atleta: conteúdo, envios, pagamentos e pendências. Arraste os cards entre as colunas.</div></div>
    <div class="row">
      <div class="input-ic"><span class="ic">${ICONS.calendar}</span><input type="month" id="crmMes" value="${State.ym}" style="width:auto; background:#fff;"></div>
      <button class="btn btn-dark" id="btnNovaTarefa">${ICONS.plus} Nova tarefa</button>
    </div>
  </div>

  <div class="grid-4" style="margin-bottom:18px;">
    ${stat(ICONS.atletas, ativos, `Atletas ativos em ${shortMonth(State.ym).toLowerCase()}`)}
    ${stat(ICONS.roteiro, State.entries.length, 'Posts agendados no mês')}
    ${stat(ICONS.kanban, abertas, 'Tarefas em aberto', atrasadas?`<span class="delta down">${atrasadas} atrasada(s)</span>`:'')}
    ${stat(ICONS.check, (State.entries.length?Math.round(postados/State.entries.length*100):0)+'%', 'Postagem confirmada')}
  </div>

  ${semCard ? `<div class="panel" style="display:flex; align-items:center; gap:14px; padding:14px 18px;">
    <span class="ic-bubble" style="color:var(--orange);">${ICONS.roteiro}</span>
    <div style="flex:1; font-size:13px;"><strong>${semCard} post(s) de ${fmtMonthLabel(State.ym)}</strong> ainda não estão no pipeline.</div>
    <button class="btn btn-primary btn-sm" id="btnGerarDosPosts">Criar cards dos posts</button></div>` : ''}

  <div class="row" style="justify-content:space-between; margin-bottom:16px;">
    <div class="seg"><button class="${State.view==='kanban'?'active':''}" data-view="kanban">${ICONS.kanban.replace('width="18" height="18"','width="14" height="14"')} Kanban</button>
      <button class="${State.view==='lista'?'active':''}" data-view="lista">${ICONS.list.replace('width="18" height="18"','width="14" height="14"')} Lista</button></div>
    <div class="row">
      <div class="input-ic"><span class="ic">${ICONS.search}</span><input id="crmBusca" placeholder="Buscar..." value="${escHtml(State.busca)}" style="background:#fff; border-radius:999px; width:190px;"></div>
      <select id="crmAtleta" style="width:auto; background:#fff; border-radius:999px;"><option value="">Todos os atletas</option>
        ${State.athletes.map(a=>`<option value="${a.id}" ${a.id===State.athlete?'selected':''}>${escHtml(a.name)}</option>`).join('')}</select>
      <div class="filter-pills">${['Todos',...TIPOS].map(t=>`<button class="fpill ${State.tipo===t?'active':''}" data-tipo="${t}" style="padding:7px 13px;">${t}</button>`).join('')}</div>
    </div>
  </div>
  ${State.view==='kanban' ? viewKanban(lista) : viewLista(lista)}`;
}

/* ---------- Modal de tarefa ---------- */
function cardFormHtml(c){
  const isNew = !c.id;
  return `<button class="modal-close" id="modalCloseBtn">&times;</button><h3>${isNew?'Nova tarefa':'Editar tarefa'}</h3>
    <div class="field"><label>Título</label><input id="cTitulo" value="${escHtml(c.titulo)}" placeholder="Ex: Enviar kit de produtos, cobrar post, pagar comissão..."></div>
    <div class="grid-2" style="gap:12px;">
      <div class="field"><label>Atleta</label><select id="cAtleta"><option value="">— Nenhum —</option>
        ${TEAM_ORDER.map(t=>{ const l = State.athletes.filter(a=>a.team===t); return l.length ? `<optgroup label="${t}">${l.map(a=>`<option value="${a.id}" ${a.id===c.athleteId?'selected':''}>${escHtml(a.name)}</option>`).join('')}</optgroup>` : ''; }).join('')}</select></div>
      <div class="field"><label>Tipo</label><select id="cTipo">${TIPOS.map(t=>`<option ${t===c.tipo?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="grid-3" style="gap:12px;">
      <div class="field"><label>Etapa</label><select id="cStage">${STAGES.map(s=>`<option value="${s.id}" ${s.id===c.stage?'selected':''}>${s.label}</option>`).join('')}</select></div>
      <div class="field"><label>Prioridade</label><select id="cPrio">${[['alta','Urgente'],['media','Média'],['baixa','Baixa']].map(([v,l])=>`<option value="${v}" ${v===c.prioridade?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Prazo</label><input type="date" id="cDue" value="${c.dueDate||''}"></div>
    </div>
    <div class="field"><label>Anotações / acompanhamento</label><textarea id="cNotas" style="min-height:110px;" placeholder="Histórico de contato, combinados, links...">${escHtml(c.notas)}</textarea></div>
    ${c.entryId ? '<div style="font-size:12px; color:var(--muted); margin-bottom:10px;">🔗 Ligado a um post do mês — ao mover pra <strong>Concluído</strong>, o post é marcado como postado no Acompanhamento.</div>' : ''}
    <div class="row" style="justify-content:space-between; margin-top:6px;">
      ${isNew ? '<span></span>' : `<button class="btn btn-danger btn-sm" id="btnDelCard">${ICONS.trash.replace('width="18" height="18"','width="13" height="13"')} Excluir</button>`}
      <button class="btn btn-primary" id="btnSaveCard">${isNew?'Criar tarefa':'Salvar'}</button></div>`;
}
function openCardModal(c){
  c = c || {id:'', titulo:'', tipo:'Acompanhamento', stage:'a_fazer', prioridade:'media', athleteId:State.athlete||'', entryId:'', dueDate:'', notas:''};
  openModal(cardFormHtml(c));
  document.getElementById('modalCloseBtn').onclick = closeModal;
  document.getElementById('btnSaveCard').onclick = async (ev)=>{
    const titulo = document.getElementById('cTitulo').value.trim();
    if(!titulo){ toast('Dê um título pra tarefa'); return; }
    const antes = c.stage;
    Object.assign(c, { titulo, athleteId:document.getElementById('cAtleta').value, tipo:document.getElementById('cTipo').value,
      stage:document.getElementById('cStage').value, prioridade:document.getElementById('cPrio').value,
      dueDate:document.getElementById('cDue').value, notas:document.getElementById('cNotas').value });
    ev.target.disabled = true;
    try{
      if(c.id){ const { error } = await sb.from('crm_cards').update(cardPayload(c)).eq('id', c.id); if(error) throw error; }
      else{ const { data, error } = await sb.from('crm_cards').insert(cardPayload(c)).select().single(); if(error) throw error; State.cards.push(mapCard(data)); }
      if(antes !== c.stage) await sincronizarPost(c);
      closeModal(); toast('Tarefa salva'); render();
    }catch(err){ console.error(err); toast('Erro ao salvar — veja o console (F12)'); ev.target.disabled = false; }
  };
  const del = document.getElementById('btnDelCard');
  if(del) del.onclick = async ()=>{
    if(!confirm('Excluir esta tarefa?')) return;
    await sb.from('crm_cards').delete().eq('id', c.id);
    State.cards = State.cards.filter(x=>x.id!==c.id); closeModal(); toast('Tarefa excluída'); render();
  };
}

// Card de conteúdo concluído → marca o post como postado (e volta a pendente se sair de Concluído)
async function sincronizarPost(c){
  if(!c.entryId) return;
  const e = State.entries.find(x=>x.id===c.entryId);
  if(c.stage==='concluido' && (!e || e.postou!=='sim')){
    await sb.from('entries').update({postou:'sim'}).eq('id', c.entryId);
    if(e) e.postou = 'sim';
    toast('Post marcado como postado no Acompanhamento');
  }
}

async function gerarCardsDosPosts(){
  const faltando = State.entries.filter(e=> !State.cards.some(c=>c.entryId===e.id));
  const rows = faltando.map(e=>{
    const stage = e.postou==='sim' ? 'concluido' : (e.roteiro && e.roteiro.trim()) ? 'andamento' : 'a_fazer';
    return { titulo:`Post ${e.product} · ${e.format}`, tipo:'Conteúdo', stage, prioridade:'media', athlete_id:e.athlete_id,
      entry_id:e.id, due_date:e.post_date, notas: e.theme ? `Tema: ${e.theme}` : '', position:0 };
  });
  if(!rows.length) return;
  const { data, error } = await sb.from('crm_cards').insert(rows).select();
  if(error){ console.error(error); toast('Erro ao criar cards'); return; }
  State.cards.push(...(data||[]).map(mapCard));
  toast(`${rows.length} card(s) criados`); render();
}

/* ---------- Drag & drop ---------- */
function wireDnD(){
  let dragId = null;
  document.querySelectorAll('.kcard').forEach(el=>{
    el.addEventListener('dragstart', e=>{ dragId = el.dataset.card; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
    el.addEventListener('click', ()=> openCardModal(State.cards.find(c=>c.id===el.dataset.card)));
  });
  document.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over'); });
    col.addEventListener('drop', async e=>{
      e.preventDefault(); col.classList.remove('drag-over');
      const c = State.cards.find(x=>x.id===dragId); if(!c) return;
      // posição: antes do card sobre o qual soltou, senão no fim da coluna
      const alvo = e.target.closest('.kcard');
      const naColuna = State.cards.filter(x=>x.stage===col.dataset.stage && x.id!==c.id).sort((a,b)=>a.position-b.position);
      let idx = alvo ? naColuna.findIndex(x=>x.id===alvo.dataset.card) : naColuna.length;
      if(idx < 0) idx = naColuna.length;
      naColuna.splice(idx, 0, c);
      const mudouEtapa = c.stage !== col.dataset.stage;
      c.stage = col.dataset.stage;
      naColuna.forEach((x,i)=> x.position = i);
      render();
      try{
        await Promise.all(naColuna.map(x=> sb.from('crm_cards').update({stage:x.stage, position:x.position}).eq('id', x.id)));
        if(mudouEtapa) await sincronizarPost(c);
      }catch(err){ console.error(err); toast('Erro ao mover — veja o console (F12)'); }
    });
  });
}

function render(){
  document.getElementById('main').innerHTML = viewPipeline();
  if(!State.tabelaOk) return;
  document.getElementById('btnNovaTarefa').onclick = ()=> openCardModal(null);
  document.getElementById('crmMes').onchange = async (e)=>{ if(!e.target.value) return; State.ym = e.target.value; await carregarEntriesDoMes(); render(); };
  const g = document.getElementById('btnGerarDosPosts'); if(g) g.onclick = gerarCardsDosPosts;
  document.querySelectorAll('[data-view]').forEach(b=> b.onclick = ()=>{ State.view = b.dataset.view; render(); });
  document.querySelectorAll('[data-tipo]').forEach(b=> b.onclick = ()=>{ State.tipo = b.dataset.tipo; render(); });
  document.getElementById('crmAtleta').onchange = (e)=>{ State.athlete = e.target.value; render(); };
  const busca = document.getElementById('crmBusca');
  busca.oninput = ()=>{ State.busca = busca.value; const pos = busca.selectionStart; render(); const b2 = document.getElementById('crmBusca'); b2.focus(); b2.setSelectionRange(pos,pos); };
  document.querySelectorAll('[data-add-stage]').forEach(b=> b.onclick = ()=>{ openCardModal(null); document.getElementById('cStage').value = b.dataset.addStage; });
  document.querySelectorAll('[data-card-open]').forEach(b=> b.onclick = ()=> openCardModal(State.cards.find(c=>c.id===b.dataset.cardOpen)));
  wireDnD();
}

(async function start(){
  const auth = await guardStaff('crm'); if(!auth) return;
  const { data } = await sb.from('athletes').select('*').order('team').order('name');
  State.athletes = (data||[]).map(mapAthleteFromDB);
  await Promise.all([carregar(), carregarEntriesDoMes()]);
  render();
})();
</script></body></html>
