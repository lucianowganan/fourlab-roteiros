<div class="shell" id="appShell"><div id="sidebarMount"></div>
<main id="main"><div class="empty-state"><span class="loader" style="border-top-color:var(--orange);border-color:rgba(0,0,0,0.1);"></span></div></main></div>
<div id="modalBg" class="modal-bg"><div id="modalBox" class="modal-box"></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
// categoria: 'equipe' (atletas) ou 'profissional' (profissionais parceiros)
const State = { athletes:[], history:{}, categoria:'equipe', teamFilter:'Todas', busca:'', teamsTabela:true, cadastros:{}, cadastroTabela:true, iaAcesso:{}, iaTabela:true, comprasOk:false, compras:{}, produtos:[], feeOk:false };
const MIGRACAO_IA = 'migrations/2026-10-07_ia_sugestoes.sql';
const iaDe = (id)=> State.iaAcesso[id] || {liberada:false, limite_mes:10};
const MIGRACAO_CADASTRO = 'migrations/2026-10-06a_cadastro_interno.sql';
const cadastroDe = (id)=> State.cadastros[id] || mapCadastroFromDB(null);
const CATEGORIAS = {
  equipe:{label:'Atletas', singular:'atleta', pasta:'equipe'},
  profissional:{label:'Profissionais parceiros', singular:'profissional', pasta:'especialidade'},
};
const CORES_SUGERIDAS = ['#1d4ed8','#0f7a3d','#b5680a','#e3055f','#731b58','#c99a00','#e96709','#0e7490','#7c3aed','#be123c','#4d7c0f','#666666'];
function teamStyle(t){ return {bg:teamSoft(t), fg:teamColor(t)}; }

async function carregarHistorico(){
  const { data } = await sb.from('entries').select('athlete_id, product, theme, post_date, format, postou, cycles(ym)');
  const hist = {};
  (data||[]).forEach(r=>{
    const ym = r.cycles?.ym; if(!ym) return;
    (hist[r.athlete_id] = hist[r.athlete_id] || []).push({ym, product:r.product, date:r.post_date, format:r.format, postou:r.postou});
  });
  Object.keys(hist).forEach(k=> hist[k].sort((a,b)=> a.date.localeCompare(b.date)));
  State.history = hist;
}
function lastEntryFor(athleteId){ const h = State.history[athleteId]||[]; return h.length ? h[h.length-1] : null; }

async function saveOneAthlete(a){
  const payload = { name:a.name, team:a.team, format_pref:a.formatPref, notes:a.notes,
    dificuldade_gravacao:a.dificuldadeGravacao||'', estilo_fala:a.estiloFala||'', estilo_video:a.estiloVideo||'', videos_transcritos:a.videosTranscritos||'',
    cupom_yampi:a.cupomYampi||'', desconto_cupom_pct:a.descontoCupomPct!=null?a.descontoCupomPct:10, comissao_pct:a.comissaoPct!=null?a.comissaoPct:10,
    recebe_comissao:!!a.recebeComissao, ver_vendas:!!a.verVendas, profissao:a.profissao||'',
    email:a.email||'', whatsapp:a.whatsapp||'', endereco_cep:a.enderecoCep||'', endereco_rua:a.enderecoRua||'', endereco_numero:a.enderecoNumero||'',
    endereco_complemento:a.enderecoComplemento||'', endereco_bairro:a.enderecoBairro||'', endereco_cidade:a.enderecoCidade||'', endereco_estado:a.enderecoEstado||'' };
  if(a.id){ const { error } = await sb.from('athletes').update(payload).eq('id', a.id); if(error) throw error; }
  else { const { data, error } = await sb.from('athletes').insert(payload).select().single(); if(error) throw error; if(data) a.id = data.id; }
}
// Cadastro interno (tabela atleta_cadastro — só a equipe lê). Data vazia vira null.
async function salvarCadastro(athleteId, c){
  const row = { athlete_id:athleteId, nome_completo:c.nomeCompleto, cpf:c.cpf, rg:c.rg, cnpj:c.cnpj, data_nascimento:c.dataNascimento||null,
    tamanho_camiseta:c.tamanhoCamiseta, inicio_parceria:c.inicioParceria||null, fim_contrato:c.fimContrato||null, observacoes:c.observacoes, updated_at:new Date().toISOString(),
    ...(State.comprasOk ? { cupom_compras:c.cupomCompras } : {}),
    ...(State.feeOk ? { fee_ativo:!!c.feeAtivo, fee_valor:Number(c.feeValor)||0, fee_dia:Math.min(31, Math.max(1, Number(c.feeDia)||5)), fee_obs:c.feeObs||'' } : {}) };
  const { error } = await sb.from('atleta_cadastro').upsert(row); if(error) throw error;
  State.cadastros[athleteId] = {...c};
}
async function deleteOneAthlete(id){ await sb.from('athletes').delete().eq('id', id); }

// Bolinhas = últimos 5 posts (verde postou, vermelho não postou, amarelo sem confirmação)
function postDotsHtml(athleteId){
  const h = (State.history[athleteId]||[]).filter(e=> e.date <= todayISO()).slice(-5);
  const cor = e=> e.postou==='sim' ? '#2fb463' : e.postou==='nao' ? '#f06b5b' : '#f5c342';
  const dots = h.map(e=>`<span style="background:${cor(e)};" title="${fmtDateBR(e.date)} · ${e.postou==='sim'?'postou':e.postou==='nao'?'não postou':'sem confirmação'}"></span>`);
  while(dots.length < 5) dots.unshift('<span></span>');
  return `<span class="dots">${dots.join('')}</span>`;
}
function taxaPostagem(athleteId){
  const h = (State.history[athleteId]||[]).filter(e=> e.postou);
  return h.length ? Math.round(h.filter(e=>e.postou==='sim').length / h.length * 100) : null;
}

function pastasDaCategoria(){ return EQUIPES.filter(e=> e.tipo===State.categoria); }
function pessoasDaCategoria(){ const nomes = pastasDaCategoria().map(e=>e.name); return State.athletes.filter(a=> nomes.includes(a.team) || (State.categoria==='equipe' && !EQUIPES.some(e=>e.name===a.team))); }
function filtrados(){
  const q = State.busca.trim().toLowerCase();
  return pessoasDaCategoria().filter(a=> (State.teamFilter==='Todas' || a.team===State.teamFilter) &&
    (!q || [a.name, a.team, a.instagram, a.cupomYampi, a.profissao].some(v=> (v||'').toLowerCase().includes(q))));
}

function viewAtletas(){
  const cat = CATEGORIAS[State.categoria];
  const pastas = pastasDaCategoria();
  const pessoas = pessoasDaCategoria();
  const porPasta = {}; pastas.forEach(p=> porPasta[p.name] = []);
  pessoas.forEach(a=> (porPasta[a.team] = porPasta[a.team] || []).push(a));
  const comComissao = pessoas.filter(a=>a.recebeComissao).length;
  const lista = filtrados();
  const nProf = State.athletes.filter(a=> isProfissional(a)).length;

  const folders = Object.keys(porPasta).map(t=>{ const st = teamStyle(t), l = porPasta[t];
    return `<div class="team-folder" data-team="${escHtml(t)}" style="background:${st.bg}; color:${st.fg}; ${State.teamFilter===t?`outline:2.5px solid ${st.fg}; outline-offset:2px;`:''}">
      <div class="row" style="justify-content:space-between; align-items:flex-start;"><span style="display:flex;">${ICONS.folder}</span>
        <button class="icon-btn" data-edit-team="${escHtml(t)}" title="Editar nome e cor da pasta" style="width:30px; height:30px; background:rgba(255,255,255,0.75); border-color:transparent; color:${st.fg};">${ICONS.roteiro.replace('width="18" height="18"','width="14" height="14"')}</button></div>
      <div><div class="tf-name">${escHtml(t)}</div>
        <div class="row" style="justify-content:space-between; margin-top:6px;"><span class="tf-meta">${l.length} ${l.length===1?cat.singular:cat.singular+'s'}</span>
          <span class="avatar-stack">${l.slice(0,4).map(a=>avatarHtml(a.name,'sm')).join('')}${l.length>4?`<span class="avatar sm" style="background:${st.fg};">+${l.length-4}</span>`:''}</span></div></div>
    </div>`; }).join('');
  const novaPasta = `<div class="team-folder" id="btnNovaPasta" style="background:transparent; border:2px dashed var(--line); color:var(--muted); align-items:center; justify-content:center; text-align:center;">
      <div style="font-size:26px; line-height:1;">+</div><div style="font-weight:700; font-size:13px;">Nova ${cat.pasta}</div></div>`;

  const cards = lista.map(a=>{
    const last = lastEntryFor(a.id), st = teamStyle(a.team), taxa = taxaPostagem(a.id);
    return `<div class="person-card" data-open-athlete="${a.id}">
      <div class="pc-top">${avatarHtml(a.name,'lg')}
        <button class="icon-btn" data-open-athlete="${a.id}" title="Ver ficha">${ICONS.arrow}</button></div>
      <div class="pc-name">${escHtml(a.name)}</div>
      <div class="pc-role"><span style="color:${st.fg}; font-weight:700;">${escHtml(a.team)}</span> · ${isProfissional(a) ? escHtml(a.profissao||'Profissional parceiro') : escHtml(a.formatPref||'—')}${a.instagram?` · ${escHtml(a.instagram.startsWith('@')||a.instagram.startsWith('http')?a.instagram:'@'+a.instagram)}`:''}</div>
      <div style="margin-top:16px;"><div class="pc-label">Redes</div>${socialLinksHtml(a)}</div>
      ${isProfissional(a) ? '' : `<div class="row" style="justify-content:space-between; margin-top:12px;"><span class="pc-label" style="margin:0;">Últimos posts${taxa!=null?` · ${taxa}% postados`:''}</span>${postDotsHtml(a.id)}</div>`}
      <div class="row" style="margin-top:14px; gap:6px;">
        ${a.cupomYampi ? `<span class="chip static">${ICONS.vendas} ${escHtml(a.cupomYampi)}</span>` : ''}
        ${cadastroDe(a.id).feeAtivo ? `<span class="chip static" style="color:var(--green); border-color:#bfe6cd; background:var(--green-soft);" title="Fee mensal — dia ${cadastroDe(a.id).feeDia}">💰 Fee ${fmtBRL(cadastroDe(a.id).feeValor).replace(',00','')}/mês</span>` : ''}
        ${cadastroDe(a.id).cupomCompras ? `<span class="chip static" title="Cupom de compras na Yampi">${ICONS.cart} ${escHtml(cadastroDe(a.id).cupomCompras)}</span>` : ''}
        ${a.recebeComissao ? `<span class="chip static" style="color:var(--green); border-color:#bfe6cd; background:var(--green-soft);">${a.comissaoPct??10}% comissão</span>` : a.verVendas ? '<span class="chip static">vê volume de vendas</span>' : ''}
        ${!isProfissional(a) ? (last ? `<span class="chip static">${escHtml(last.product)} · ${shortMonth(last.ym)}</span>` : '<span class="chip static" style="color:var(--muted);">nunca postou</span>') : ''}
        ${a.dificuldadeGravacao==='sim' && !isProfissional(a) ? '<span class="chip static" style="color:#b5680a;">trava na câmera</span>' : ''}
        ${aniversarioNoMes(cadastroDe(a.id).dataNascimento) ? `<span class="chip static" style="color:var(--purple);">🎂 aniversário dia ${cadastroDe(a.id).dataNascimento.slice(8,10)}</span>` : ''}
        ${alertaContrato(cadastroDe(a.id))}
        ${iaDe(a.id).liberada ? `<span class="chip static" style="color:#b5480a;">✨ IA · ${iaDe(a.id).limite_mes}/mês</span>` : ''}
      </div>
    </div>`; }).join('');

  const stat = (n, label)=> `<div><span style="font-size:34px; font-weight:500; letter-spacing:-1px;">${n}</span> <span style="font-size:14px;">${label}</span></div>`;
  return `
  <div class="page-head">
    <div><h1>${cat.label}</h1><div class="sub">Organize por pasta e abra a ficha completa de cada ${cat.singular}.</div></div>
    <div class="row" style="gap:26px;">
      ${stat(pessoas.length, cat.label)}${stat(pastas.length, State.categoria==='equipe'?'Equipes':'Especialidades')}${stat(comComissao, 'Com comissão')}
      <button class="btn btn-ghost" id="btnExportar" title="Baixar planilha com o cadastro completo (abre no Excel / Google Planilhas)">⬇ Planilha</button>
      <button class="btn btn-dark" id="btnNovoAtleta">${ICONS.plus} Novo ${cat.singular}</button>
    </div>
  </div>

  <div class="seg brand" style="margin-bottom:18px;">
    <button class="${State.categoria==='equipe'?'active':''}" data-categoria="equipe">${ICONS.atletas.replace('width="18" height="18"','width="14" height="14"')} Atletas <span style="opacity:0.7;">${State.athletes.length-nProf}</span></button>
    <button class="${State.categoria==='profissional'?'active':''}" data-categoria="profissional">${ICONS.perfil.replace('width="18" height="18"','width="14" height="14"')} Profissionais parceiros <span style="opacity:0.7;">${nProf}</span></button>
  </div>
  ${!State.cadastroTabela ? `<div class="panel" style="padding:12px 16px; font-size:12.5px; background:var(--orange-soft); border-color:#f8d6ba;">Pra guardar CPF, nascimento e o resto do cadastro interno, rode <code>${MIGRACAO_CADASTRO}</code> no Supabase.</div>` : ''}
  ${!State.teamsTabela ? `<div class="panel" style="padding:12px 16px; font-size:12.5px; background:var(--orange-soft); border-color:#f8d6ba;">Pra criar pastas e trocar cores, rode <code>migrations/2026-09-27_equipes_comissao.sql</code> no Supabase.</div>` : ''}

  <div class="section-title" style="font-size:12px;">Pastas · ${State.categoria==='equipe'?'equipes':'especialidades (médicos, nutricionistas...)'}</div>
  <div class="folder-grid" style="grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); margin-bottom:28px;">${folders}${novaPasta}</div>

  <div class="row" style="justify-content:space-between; margin-bottom:16px;">
    <div class="row"><h2 style="font-size:22px; font-weight:500; letter-spacing:-0.3px; margin-right:10px;">${State.teamFilter==='Todas'?`Todos os ${cat.label.toLowerCase()}`:escHtml(State.teamFilter)}</h2>
      <span style="font-size:13px; font-weight:700; border-bottom:2px solid var(--ink);">${lista.length}</span></div>
    <div class="row">
      <div class="input-ic"><span class="ic">${ICONS.search}</span><input id="buscaAtleta" placeholder="Buscar nome, @, cupom..." value="${escHtml(State.busca)}" style="background:#fff; border-radius:999px; min-width:230px;"></div>
      <div class="filter-pills">
        <button class="fpill ${State.teamFilter==='Todas'?'active':''}" data-filter-team="Todas">Todas <span class="count">${pessoas.length}</span></button>
        ${Object.keys(porPasta).filter(t=>porPasta[t].length).map(t=>`<button class="fpill ${State.teamFilter===t?'active':''}" data-filter-team="${escHtml(t)}">${escHtml(t)} <span class="count">${porPasta[t].length}</span></button>`).join('')}
      </div>
    </div>
  </div>
  ${lista.length ? `<div class="folder-grid">${cards}</div>` : `<div class="panel"><div class="empty-state">Nenhum ${cat.singular} aqui ainda.</div></div>`}`;
}

/* ---------- Pastas (equipes / especialidades) ---------- */
function pastaFormHtml(t){
  const isNew = !t;
  t = t || {name:'', color: CORES_SUGERIDAS[EQUIPES.length % CORES_SUGERIDAS.length], tipo:State.categoria};
  const qtd = t.name ? State.athletes.filter(a=>a.team===t.name).length : 0;
  return `<button class="modal-close" id="modalCloseBtn">&times;</button><h3>${isNew?'Nova pasta':'Editar pasta'}</h3>
    <div class="field"><label>Nome</label><input id="tName" value="${escHtml(t.name)}" placeholder="${t.tipo==='profissional'?'Ex: Nutricionistas':'Ex: Specialized'}"></div>
    <div class="field"><label>Categoria</label><select id="tTipo">
      <option value="equipe" ${t.tipo==='equipe'?'selected':''}>Equipe de atletas</option>
      <option value="profissional" ${t.tipo==='profissional'?'selected':''}>Profissionais parceiros (médicos, nutricionistas...)</option></select></div>
    <div class="field"><label>Cor da pasta</label>
      <div class="row" style="gap:8px;">
        ${CORES_SUGERIDAS.map(c=>`<button type="button" data-cor="${c}" title="${c}" style="width:30px; height:30px; border-radius:50%; background:${c}; cursor:pointer; border:3px solid ${c.toLowerCase()===String(t.color).toLowerCase()?'var(--ink)':'#fff'}; box-shadow:0 0 0 1px var(--line);"></button>`).join('')}
        <input type="color" id="tColor" value="${escHtml(t.color)}" style="width:46px; height:34px; padding:2px; border-radius:10px;" title="Escolher outra cor">
      </div></div>
    <div class="field"><label>Prévia</label><div id="tPreview"></div></div>
    <div class="row" style="justify-content:space-between; margin-top:10px;">
      ${isNew ? '<span></span>' : `<button class="btn btn-danger btn-sm" id="btnDelPasta" ${qtd?`disabled title="Mova os ${qtd} integrante(s) antes de excluir"`:''}>Excluir pasta${qtd?` (${qtd} dentro)`:''}</button>`}
      <button class="btn btn-primary" id="btnSavePasta">${isNew?'Criar pasta':'Salvar'}</button></div>`;
}
function openPastaModal(nome){
  const t = nome ? EQUIPES.find(e=>e.name===nome) : null;
  openModal(pastaFormHtml(t));
  document.getElementById('modalCloseBtn').onclick = closeModal;
  const color = document.getElementById('tColor'), nameEl = document.getElementById('tName');
  const preview = ()=>{
    const c = color.value, n = nameEl.value || 'Nome da pasta';
    const tmp = {name:'__preview', color:c}; EQUIPES.push(tmp);
    document.getElementById('tPreview').innerHTML = `<div class="team-folder" style="background:${teamSoft('__preview')}; color:${c}; min-height:90px; max-width:220px; cursor:default;"><span style="display:flex;">${ICONS.folder}</span><div class="tf-name" style="color:${c};">${escHtml(n)}</div></div>`;
    EQUIPES.pop();
    document.querySelectorAll('[data-cor]').forEach(b=> b.style.borderColor = b.dataset.cor.toLowerCase()===c.toLowerCase() ? 'var(--ink)' : '#fff');
  };
  color.oninput = preview; nameEl.oninput = preview;
  document.querySelectorAll('[data-cor]').forEach(b=> b.onclick = ()=>{ color.value = b.dataset.cor; preview(); });
  preview();
  document.getElementById('btnSavePasta').onclick = async (ev)=>{
    const novoNome = nameEl.value.trim(), tipo = document.getElementById('tTipo').value;
    if(!novoNome){ toast('Dê um nome pra pasta'); return; }
    if(EQUIPES.some(e=> e.name.toLowerCase()===novoNome.toLowerCase() && e!==t)){ toast('Já existe uma pasta com esse nome'); return; }
    ev.target.disabled = true;
    try{
      if(t && t.id){
        const { error } = await sb.from('teams').update({name:novoNome, color:color.value, tipo}).eq('id', t.id); if(error) throw error;
        if(novoNome !== t.name){
          // renomeia também nos atletas e no histórico de posts
          await sb.from('athletes').update({team:novoNome}).eq('team', t.name);
          await sb.from('entries').update({team:novoNome}).eq('team', t.name);
          State.athletes.forEach(a=>{ if(a.team===t.name) a.team = novoNome; });
          if(State.teamFilter===t.name) State.teamFilter = novoNome;
        }
      }else{
        const { error } = await sb.from('teams').insert({name:novoNome, color:color.value, tipo, position:EQUIPES.length}); if(error) throw error;
      }
      await carregarEquipes();
      State.categoria = tipo;
      closeModal(); toast('Pasta salva'); render();
    }catch(err){ erroBanco(err, 'migrations/2026-09-27_equipes_comissao.sql'); ev.target.disabled = false; }
  };
  const del = document.getElementById('btnDelPasta');
  if(del) del.onclick = async ()=>{
    if(!confirm(`Excluir a pasta "${t.name}"?`)) return;
    const { error } = await sb.from('teams').delete().eq('id', t.id);
    if(error){ console.error(error); toast('Erro ao excluir'); return; }
    await carregarEquipes(); if(State.teamFilter===t.name) State.teamFilter = 'Todas';
    closeModal(); toast('Pasta excluída'); render();
  };
}

/* ---------- Ficha lateral ---------- */
function linhaInfo(ic, label, valor){
  return `<div style="display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #f3eee8;">
    <span class="ic-bubble" style="width:34px; height:34px;">${ic}</span>
    <div style="min-width:0;"><div style="font-size:11px; color:var(--muted); font-weight:600;">${label}</div>
      <div style="font-size:13px; font-weight:600; word-break:break-word;">${valor || '<span style="color:var(--muted); font-weight:500;">não informado</span>'}</div></div></div>`;
}
function athleteDrawerHtml(a){
  const st = teamStyle(a.team), hist = (State.history[a.id]||[]).slice().reverse().slice(0,6);
  const end = [a.enderecoRua && `${a.enderecoRua}${a.enderecoNumero?', '+a.enderecoNumero:''}${a.enderecoComplemento?' — '+a.enderecoComplemento:''}`,
    a.enderecoBairro, [a.enderecoCidade, a.enderecoEstado].filter(Boolean).join('/'), a.enderecoCep && 'CEP '+a.enderecoCep].filter(Boolean).map(escHtml).join('<br>');
  return `
    <div class="row" style="justify-content:space-between;"><button class="icon-btn" onclick="closeDrawer()" title="Fechar">${ICONS.back}</button>
      <div class="row">${isProfissional(a)?'':'<button class="btn btn-ghost btn-sm" id="drBanco">📂 Banco de roteiros</button>'}<button class="btn btn-dark btn-sm" id="drEditar">Editar</button></div></div>
    <div style="text-align:center; margin:18px 0 8px;">${avatarHtml(a.name,'xl')}

function alertaContrato(c){
  if(!c.fimContrato) return '';

  if(dias < 0) return `<span class="chip static" style="color:var(--red);">contrato venceu ${fmtDateBR(c.fimContrato)}</span>`;
  if(dias <= 30) return `<span class="chip static" style="color:#b5680a;">contrato vence ${fmtDateBR(c.fimContrato)}</span>`;
  return '';
}

// Comprovantes de pagamento (o atleta vê os mesmos no Meu Perfil)
async function carregarComprovantesDoAtleta(a){
  const el = document.getElementById('drComprovantes'); if(!el) return;
  const { data, error } = await sb.from('comprovantes').select('*').eq('athlete_id', a.id).order('data', {ascending:false});
  const btn = document.getElementById('drNovoComprovante');
  if(error){ el.innerHTML = `Rode <code>${MIGRACAO_COMPROVANTES}</code> no Supabase pra anexar comprovantes.`; if(btn) btn.style.display = 'none'; return; }
  const lista = data || [];
  const desenhar = ()=>{ el.innerHTML = comprovantesListaHtml(lista, {equipe:true, vazio:'Nenhum comprovante ainda. Eles entram sozinhos quando você registra um pagamento em Vendas, ou anexe aqui.'}); ligarComprovantes(el, lista, desenhar); };
  desenhar();
  if(btn) btn.onclick = ()=> abrirNovoComprovante(a, (c)=>{ lista.unshift(c); lista.sort((x,y)=> String(y.data).localeCompare(String(x.data))); desenhar(); });
}
// Roteiros do atleta (rascunhos e enviados), com as marcas de alterado. Abrir = editar.
async function carregarRoteirosDoAtleta(a){
  const el = document.getElementById('drRoteiros'); if(!el) return;
  const { data, error } = await sb.from('entries').select('*').eq('athlete_id', a.id).order('post_date', {ascending:false}).limit(12);
  if(error){ el.textContent = 'Não consegui carregar os roteiros.'; return; }
  const lista = (data||[]).filter(r=> (r.roteiro||'').trim()).map(r=>({ id:r.id, date:r.post_date, product:r.product, format:r.format, roteiro:r.roteiro||'', ...camposEnvioDeLinha(r) }));
  const desenhar = ()=>{
    el.innerHTML = `<div style="margin-bottom:6px;"><button class="btn btn-ghost btn-sm" id="drPostManual" style="padding:5px 10px;">✍️ Novo post manual</button></div>` + (lista.length ? lista.map(e=>`<div style="padding:9px 0; border-bottom:1px solid #f3eee8;">
        <div class="row" style="justify-content:space-between; gap:8px;"><div style="color:var(--ink);"><strong>${fmtDateBR(e.date)}</strong> · ${escHtml(e.product||'')} · ${escHtml(e.format||'')}</div>
          <button class="btn btn-ghost btn-sm" data-dr-roteiro="${e.id}" style="padding:5px 10px;">Abrir</button></div>
        <div class="row" style="gap:4px; margin-top:5px;">${tagsRoteiroHtml(e)}</div></div>`).join('')
      : 'Nenhum roteiro gerado ainda.');
    document.getElementById('drPostManual').onclick = ()=> abrirPostManual({ atletas:State.athletes, produtos:State.produtos, athleteId:a.id,
      onCriado:(r)=>{ lista.unshift({ id:r.id, date:r.post_date, product:r.product, format:r.format, roteiro:r.roteiro||'', ...camposEnvioDeLinha(r) }); desenhar(); } });
    el.querySelectorAll('[data-dr-roteiro]').forEach(b=> b.onclick = ()=> abrirRoteiroDaEquipe(lista.find(x=>x.id===b.dataset.drRoteiro), a.name, ()=>{ lista.splice(0, lista.length, ...lista.filter(x=> x.roteiro.trim())); desenhar(); }));
  };
  desenhar();
}
function openAthleteDrawer(a){
  openDrawer(athleteDrawerHtml(a));
  carregarRoteirosDoAtleta(a);
  carregarComprovantesDoAtleta(a);
  const atu = document.getElementById('drAtualizarCompras');
  if(atu) atu.onclick = async ()=>{
    atu.disabled = true; atu.innerHTML = '<span class="loader" style="border-top-color:var(--orange);border-color:rgba(0,0,0,0.1);"></span> Buscando…';
    try{ const r = await atualizarComprasYampi([a.id]); (r.resultados||[]).forEach(x=> State.compras[x.athlete_id] = x); openAthleteDrawer(a); toast('Compras atualizadas'); }
    catch(err){ atu.disabled = false; atu.textContent = '↻ Atualizar'; mostrarFaixaErro('Não consegui buscar na Yampi.', escHtml(err.message)); }
  };
  document.getElementById('drEditar').onclick = ()=>{ closeDrawer(); openAthleteModal(a); };
  const banco = document.getElementById('drBanco');
  if(banco) banco.onclick = async ()=>{
    const { data, error } = await sb.from('roteiro_exemplos').select('*').eq('athlete_id', a.id).order('created_at', {ascending:false});
    if(error){ toast('Erro ao buscar'); console.error(error); return; }
    openBancoDadosModal(a.name, data||[]);
  };
}

async function buscarCepForm(){
  const el = document.getElementById('fCep'), cep = soDigitos(el.value);
  if(cep.length !== 8) return;
  el.value = cep.slice(0,5)+'-'+cep.slice(5);
  try{
    const d = await (await fetch(`https://viacep.com.br/ws/${cep}/json/`)).json();
    if(d.erro){ toast('CEP não encontrado'); return; }
    const set = (id, val)=>{ const i = document.getElementById(id); if(val && !i.value) i.value = val; };
    set('fRua', d.logradouro); set('fBairro', d.bairro); set('fCidade', d.localidade); set('fEstado', d.uf);
    document.getElementById('fNumero').focus();
  }catch(err){ console.error(err); }
}
function athleteFormHtml(a){

  a = a || {id:'', name:'', team: pastasDaCategoria()[0]?.name || 'Avulsos', formatPref:'Vídeo', notes:'', dificuldadeGravacao:'', estiloFala:'', estiloVideo:'', videosTranscritos:'', recebeComissao:false, profissao:''};
  const grupos = [['equipe','Equipes de atletas'],['profissional','Profissionais parceiros']];
  return `<button class="modal-close" id="modalCloseBtn">&times;</button><h3>${isNew?`Novo ${CATEGORIAS[State.categoria].singular}`:`Editar — ${escHtml(a.name)}`}</h3>
    <input type="hidden" id="fId" value="${a.id}">
    <div class="field"><label>Nome</label><input id="fName" value="${escHtml(a.name)}"></div>
    <div class="grid-2" style="gap:12px;">
      <div class="field"><label>Pasta (equipe ou especialidade)</label><select id="fTeam">
        ${grupos.map(([tipo,label])=>{ const l = EQUIPES.filter(e=>e.tipo===tipo); return l.length ? `<optgroup label="${label}">${l.map(e=>`<option value="${escHtml(e.name)}" ${e.name===a.team?'selected':''}>${escHtml(e.name)}</option>`).join('')}</optgroup>` : ''; }).join('')}
        ${!EQUIPES.some(e=>e.name===a.team) && a.team ? `<option selected>${escHtml(a.team)}</option>` : ''}</select></div>
      <div class="field" id="fProfissaoWrap"><label>Profissão / especialidade</label><input id="fProfissao" value="${escHtml(a.profissao||'')}" placeholder="Ex: Nutricionista esportivo, Médico do esporte"></div>
      <div class="field" id="fFormatWrap"><label>Formato preferido</label><select id="fFormat">
        <option ${a.formatPref==='Vídeo'?'selected':''}>Vídeo</option><option ${a.formatPref==='Carrossel'?'selected':''}>Carrossel</option><option ${a.formatPref==='Os dois'?'selected':''}>Os dois</option></select></div></div>
    ${cadastroFormHtml(a)}
    <div id="fConteudoWrap">
    <div class="grid-2" style="gap:12px;">
      <div class="field"><label>Dificuldade pra gravar?</label><select id="fDificuldade">
        <option value="" ${!a.dificuldadeGravacao?'selected':''}>Não avaliado</option>
        <option value="sim" ${a.dificuldadeGravacao==='sim'?'selected':''}>Sim, trava na frente da câmera</option>
        <option value="nao" ${a.dificuldadeGravacao==='nao'?'selected':''}>Não, é solto</option></select></div>
      <div class="field"><label>Estilo de fala</label><input id="fEstiloFala" value="${escHtml(a.estiloFala||'')}" placeholder="Ex: direto, bem-humorado..."></div></div>
    <div class="field"><label>Estilo de vídeo que costuma produzir</label><input id="fEstiloVideo" value="${escHtml(a.estiloVideo||'')}" placeholder="Ex: bastidor, storytelling..."></div>
    <div class="field"><label>Vídeos transcritos (3-5 vídeos, referência de tom pra IA)</label><textarea id="fVideosTranscritos" style="min-height:120px;">${escHtml(a.videosTranscritos||'')}</textarea></div>
    </div>
    <div class="field"><label>Notas internas</label><textarea id="fNotes">${escHtml(a.notes||'')}</textarea></div>

    <div class="section-title">Cupom e comissão</div>
    <div class="grid-2" style="gap:12px;">
      <div class="field"><label>Código do cupom Yampi</label><input id="fCupomYampi" value="${escHtml(a.cupomYampi||'')}" placeholder="ex: 30luiza"></div>
      <div class="field"><label>% desconto do cupom</label><input id="fDescontoCupom" type="number" value="${a.descontoCupomPct!=null?a.descontoCupomPct:10}"></div></div>
    ${toggleHtml('fRecebeComissao', a.recebeComissao, 'Recebe comissão — liberar acesso a Vendas', 'Com isso ligado, ele vê a área "Minhas vendas", o saldo e cadastra a chave PIX. Desligado, o cupom é só de desconto.')}
    <div id="fVerVendasWrap">${toggleHtml('fVerVendas', a.verVendas, 'Mostrar volume de vendas (sem valores)', 'Sem comissão, mas quer acompanhar: ele vê só quantos pedidos saíram com o cupom — nenhum valor em R$, comissão ou saldo.')}</div>
    <div class="field" id="fComissaoWrap"><label>% de comissão</label><input id="fComissaoPct" type="number" value="${a.comissaoPct!=null?a.comissaoPct:10}" style="max-width:160px;"></div>
    ${feeFormHtml(a)}

    <div class="section-title">IA de ideias</div>
    ${!State.iaTabela ? `<div style="font-size:12px; background:var(--orange-soft); border-radius:12px; padding:10px 12px; margin-bottom:12px;">Rode <code>${MIGRACAO_IA}</code> no Supabase pra liberar a IA pras pessoas.</div>` : `
    ${toggleHtml('fIaLiberada', a.id ? iaDe(a.id).liberada : false, 'Pode pedir ideias de conteúdo à IA', 'Ela vê "Pedir ideia à IA" em Ideias pra gravar. A IA só cria conteúdo da FourLab; pedidos fora disso são recusados e contam no limite.')}
    <div class="field" id="fIaLimiteWrap"><label>Limite de ideias por mês</label><input id="fIaLimite" type="number" min="0" max="200" value="${a.id ? iaDe(a.id).limite_mes : 10}" style="max-width:160px;"></div>`}

    ${!isNew ? `<div class="section-title">Acesso ao painel</div>
    <div style="font-size:12.5px; color:var(--ink-2); background:var(--surface-2); border-radius:12px; padding:12px 14px; margin-bottom:12px; line-height:1.5;">
      <strong>Como funciona:</strong> você cria o usuário e a senha aqui e envia pra pessoa (tem um botão que copia a mensagem pronta).
      No primeiro acesso ela cai na página inicial e completa o próprio perfil: contato, redes, endereço e PIX.</div>
    <div class="desc" style="margin-bottom:10px; font-size:12px; color:var(--muted);">${a.username ? `Usuário atual: <strong style="color:var(--ink);">${escHtml(a.username)}</strong>. Preencha uma senha nova pra redefinir.` : 'Ainda sem acesso criado.'}</div>
    <div class="grid-3" style="gap:12px;">
      <div class="field"><label>Usuário</label><input id="fUsername" value="${escHtml(a.username||'')}" placeholder="ex: danielzoia"></div>
      <div class="field"><label>Senha</label><input id="fPassword" type="text" placeholder="mín. 6 caracteres"></div>
      <div class="field" style="display:flex; align-items:flex-end;"><button class="btn btn-outline btn-sm" id="btnCriarAcesso" type="button" style="width:100%; padding:11px;">${a.username?'Redefinir senha':'Liberar acesso ao painel'}</button></div></div>
    <div id="acessoResultado" style="font-size:12px; margin-bottom:6px;"></div>` : `<div style="font-size:12px; color:var(--muted); margin:6px 0 10px;">Depois de salvar, abra de novo pra criar o login de acesso ao painel.</div>`}
    <div class="row" style="justify-content:space-between;margin-top:10px;">
      ${isNew?'<span></span>':`<button class="btn btn-danger btn-sm" id="btnDeleteAthlete">Remover</button>`}
      <button class="btn btn-primary" id="btnSaveAthlete">${isNew?'Adicionar':'Salvar'}</button></div>`;
}

function openBancoDadosModal(athleteName, exemplos){
  const html = `<button class="modal-close" id="modalCloseBtn2">&times;</button><h3>Banco de roteiros — ${escHtml(athleteName)}</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:12px;">${exemplos.length} roteiro(s) arquivados.</div>
    ${exemplos.length===0 ? '<div style="color:var(--muted);font-size:12px;">Nada arquivado ainda.</div>' :
      exemplos.map(ex=>`<div style="border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px;">
          <div class="row" style="justify-content:space-between;">
            <span class="badge" style="background:${ex.tipo==='bom'?'#dbf3e4':'#fdeceb'}; color:${ex.tipo==='bom'?'#0f7a3d':'#c0392b'};">${ex.tipo==='bom'?'👍 Bom':'👎 Descartado'}</span>
            <span style="font-size:11px; color:var(--muted);">${escHtml(ex.team||'')} · ${escHtml(ex.produto||'')} · ${escHtml(ex.formato||'')} · ${new Date(ex.created_at).toLocaleDateString('pt-BR')}</span></div>
          <pre style="white-space:pre-wrap; font-size:12px; margin-top:8px; max-height:220px; overflow-y:auto;">${escHtml(ex.roteiro_text)}</pre>
          <button class="btn btn-ghost btn-sm" data-copy-exemplo="${ex.id}" style="margin-top:6px;">Copiar</button></div>`).join('')}`;
  openModal(html);
  document.getElementById('modalCloseBtn2').onclick = closeModal;
  document.querySelectorAll('[data-copy-exemplo]').forEach((btn, i)=>{ btn.onclick = ()=> navigator.clipboard.writeText(exemplos[i].roteiro_text).then(()=> toast('Copiado')); });
}

function mensagemBoasVindas(nome, username, password){
  const link = new URL('login', location.href).href;
  return `Oi, ${nome.split(' ')[0]}! 👋 Seu acesso ao painel FourLab está pronto.\n\n` +
    `🔗 ${link}\n👤 Usuário: ${username}\n🔑 Senha: ${password}\n\n` +
    `No primeiro acesso, entra em "Meu Perfil" e completa seus dados (contato, redes sociais e endereço de envio). Qualquer dúvida é só chamar!`;
}

function wireAthleteModalHandlers(){
  document.getElementById('modalCloseBtn').onclick = closeModal;
  // mostra/esconde campos conforme a pasta escolhida (atleta x profissional) e a comissão
  const teamSel = document.getElementById('fTeam'), comissao = document.getElementById('fRecebeComissao');
  const sync = ()=>{
    const prof = equipeInfo(teamSel.value).tipo === 'profissional';
    document.getElementById('fProfissaoWrap').style.display = prof ? '' : 'none';
    document.getElementById('fFormatWrap').style.display = prof ? 'none' : '';
    document.getElementById('fConteudoWrap').style.display = prof ? 'none' : '';
    document.getElementById('fComissaoWrap').style.display = comissao.checked ? '' : 'none';
    document.getElementById('fVerVendasWrap').style.display = comissao.checked ? 'none' : '';
  };
  teamSel.onchange = sync; comissao.onchange = sync; sync();
  const feeAtivo = document.getElementById('fFeeAtivo');
  if(feeAtivo){ const syncFee = ()=>{ document.getElementById('fFeeWrap').style.display = feeAtivo.checked ? '' : 'none'; }; feeAtivo.onchange = syncFee; syncFee(); }
  const iaLib = document.getElementById('fIaLiberada');
  if(iaLib){ const syncIa = ()=>{ document.getElementById('fIaLimiteWrap').style.display = iaLib.checked ? '' : 'none'; }; iaLib.onchange = syncIa; syncIa(); }
  const cpf = document.getElementById('cCpf'), cnpj = document.getElementById('cCnpj'), cpfAviso = document.getElementById('cCpfAviso');
  const checaCpf = ()=>{ const d = soDigitos(cpf.value); cpfAviso.textContent = d.length===11 && !cpfValido(d) ? 'CPF inválido — confira os números' : ''; };
  cpf.oninput = ()=>{ cpf.value = fmtCPF(cpf.value); checaCpf(); };
  cnpj.oninput = ()=>{ cnpj.value = fmtCNPJ(cnpj.value); };
  const sugerir = document.getElementById('btnSugerirCupom');
  if(sugerir) sugerir.onclick = ()=>{
    const nome = document.getElementById('cNomeCompleto').value || document.getElementById('fName').value;
    const cupom = sugerirCupomCompras(nome, cpf.value);
    if(!cupom){ toast('Preencha o nome e o CPF (11 dígitos) primeiro'); return; }
    document.getElementById('cCupomCompras').value = cupom;
  };
  document.getElementById('fCep').addEventListener('input', buscarCepForm);

  const btnCriarAcesso = document.getElementById('btnCriarAcesso');
  if(btnCriarAcesso){
    btnCriarAcesso.onclick = async ()=>{
      const athleteId = document.getElementById('fId').value, athleteName = document.getElementById('fName').value;
      const username = document.getElementById('fUsername').value.trim(), password = document.getElementById('fPassword').value;
      const resBox = document.getElementById('acessoResultado');
      if(!username || !password){ resBox.innerHTML = '<span style="color:var(--red);">Preencha usuário e senha</span>'; return; }
      if(password.length < 6){ resBox.innerHTML = '<span style="color:var(--red);">A senha precisa ter pelo menos 6 caracteres</span>'; return; }
      btnCriarAcesso.disabled = true; btnCriarAcesso.innerHTML = '<span class="loader" style="border-top-color:var(--orange); border-color:rgba(0,0,0,0.1);"></span>'; resBox.innerHTML = '';
      try{
        const { data, error } = await invocarFuncao('criar-acesso-atleta', { athleteId, athleteName, username, password });
        if(error) throw error;
        if(data.error){ resBox.innerHTML = `<span style="color:var(--red);">${escHtml(data.error)}</span>`; }
        else{
          const msg = mensagemBoasVindas(athleteName, data.username, password);
          resBox.innerHTML = `<div style="background:var(--green-soft); border-radius:12px; padding:12px; color:var(--green);">✔ Acesso pronto — usuário: <strong>${escHtml(data.username)}</strong>
            <div style="margin-top:8px;"><button class="btn btn-sm btn-dark" type="button" id="btnCopiarBoasVindas">${ICONS.copy.replace('width="18" height="18"','width="13" height="13"')} Copiar mensagem pro WhatsApp</button></div></div>`;
          document.getElementById('btnCopiarBoasVindas').onclick = ()=> navigator.clipboard.writeText(msg).then(()=> toast('Mensagem copiada'));
          const idx = State.athletes.findIndex(x=>x.id===athleteId); if(idx>-1) State.athletes[idx].username = data.username;
        }
      }catch(err){
        console.error(err);
        // FunctionsFetchError = o navegador nem conseguiu falar com a função (não publicada ou sem CORS)
        const semFuncao = err && (err.name==='FunctionsFetchError' || /Failed to send a request/i.test(err.message||''));
        resBox.innerHTML = semFuncao
          ? `<div style="background:var(--red-soft); color:var(--red); border-radius:12px; padding:10px 12px;"><strong>A função de criar acesso não respondeu.</strong><br>
             Ela precisa estar publicada no Supabase com o nome <code>criar-acesso-atleta</code> (código em <code>supabase/functions/criar-acesso-atleta/index.ts</code> no repositório).</div>`
          : `<span style="color:var(--red);">Falhou: ${escHtml(err.message||err)}</span>`;
      }
      btnCriarAcesso.disabled = false;
      const temAcesso = State.athletes.find(x=>x.id===document.getElementById('fId').value)?.username;
      btnCriarAcesso.textContent = temAcesso ? 'Redefinir senha' : 'Liberar acesso ao painel';
    };
  }
  document.getElementById('btnSaveAthlete').onclick = async ()=>{
    const saveBtn = document.getElementById('btnSaveAthlete');
    const name = document.getElementById('fName').value.trim();
    if(!name){ toast('Nome é obrigatório'); return; }
    const fields = {
      team: teamSel.value, formatPref: document.getElementById('fFormat').value, profissao: document.getElementById('fProfissao').value.trim(),
      notes: document.getElementById('fNotes').value.trim(), dificuldadeGravacao: document.getElementById('fDificuldade').value,
      estiloFala: document.getElementById('fEstiloFala').value.trim(), estiloVideo: document.getElementById('fEstiloVideo').value.trim(),
      videosTranscritos: document.getElementById('fVideosTranscritos').value.trim(), cupomYampi: document.getElementById('fCupomYampi').value.trim(),
      descontoCupomPct: Number(document.getElementById('fDescontoCupom').value) || 10, comissaoPct: Number(document.getElementById('fComissaoPct').value) || 10,
      recebeComissao: comissao.checked, verVendas: !comissao.checked && document.getElementById('fVerVendas').checked,
      email: document.getElementById('fEmail').value.trim(), whatsapp: document.getElementById('fWhatsapp').value.trim(),
      enderecoCep: document.getElementById('fCep').value.trim(), enderecoRua: document.getElementById('fRua').value.trim(),
      enderecoNumero: document.getElementById('fNumero').value.trim(), enderecoComplemento: document.getElementById('fComplemento').value.trim(),
      enderecoBairro: document.getElementById('fBairro').value.trim(), enderecoCidade: document.getElementById('fCidade').value.trim(),
      enderecoEstado: document.getElementById('fEstado').value.trim().toUpperCase() };
    const cadastro = lerCadastroForm();
    if(cadastro.cpf && !cpfValido(cadastro.cpf) && !confirm('O CPF parece inválido. Salvar mesmo assim?')) return;
    const id = document.getElementById('fId').value;
    saveBtn.disabled = true; saveBtn.innerHTML = '<span class="loader"></span>';
    try{
      let athleteObj;
      if(id){ const idx = State.athletes.findIndex(x=>x.id===id); athleteObj = {...State.athletes[idx], name, ...fields}; await saveOneAthlete(athleteObj); State.athletes[idx] = athleteObj; }
      else{ athleteObj = {id:null, name, ...fields}; await saveOneAthlete(athleteObj); State.athletes.push(athleteObj); }
      if(iaLib){
        const ia = { liberada: iaLib.checked, limite_mes: Math.max(0, Math.min(200, parseInt(document.getElementById('fIaLimite').value) || 0)) };
        const atual = iaDe(athleteObj.id);
        if(ia.liberada !== atual.liberada || (ia.liberada && ia.limite_mes !== atual.limite_mes)){
          const { error } = await sb.from('ia_acesso').upsert({ athlete_id:athleteObj.id, ...ia, updated_at:new Date().toISOString() });
          if(error){ closeModal(); render(); erroBanco(error, MIGRACAO_IA); return; }
          State.iaAcesso[athleteObj.id] = ia;
        }
      }
      const mudouCadastro = JSON.stringify(cadastro) !== JSON.stringify(cadastroDe(athleteObj.id));
      if(mudouCadastro && State.cadastroTabela){
        try{ await salvarCadastro(athleteObj.id, cadastro); }
        catch(err){ closeModal(); render(); erroBanco(err, MIGRACAO_CADASTRO); return; }
      }
      closeModal(); toast(mudouCadastro && !State.cadastroTabela ? 'Salvo (sem CPF/nascimento — falta a migração)' : 'Salvo'); render();
    }catch(err){ erroBanco(err, 'migrations/2026-09-28_volume_vendas.sql'); saveBtn.disabled = false; saveBtn.textContent = 'Salvar'; }
  };
  const delBtn = document.getElementById('btnDeleteAthlete');
  if(delBtn){
    delBtn.onclick = async ()=>{
      const id = document.getElementById('fId').value;
      if(!confirm('Remover? Isso não apaga o histórico de meses já gerados.')) return;
      try{ State.athletes = State.athletes.filter(x=>x.id!==id); await deleteOneAthlete(id); closeModal(); toast('Removido'); render(); }
      catch(err){ console.error(err); toast('Erro ao remover — veja o console (F12)'); }
    };
  }
}
function openAthleteModal(athlete){ openModal(athleteFormHtml(athlete)); wireAthleteModalHandlers(); }

// Planilha (CSV com ; — abre direto no Excel em português) com o cadastro completo da categoria aberta
function exportarPlanilha(){
  const pessoas = filtrados();
  const cols = [['Nome','name'],['Pasta','team'],['Nome completo',a=>cadastroDe(a.id).nomeCompleto],['CPF',a=>fmtCPF(cadastroDe(a.id).cpf)],['RG',a=>cadastroDe(a.id).rg],
    ['CNPJ',a=>fmtCNPJ(cadastroDe(a.id).cnpj)],['Nascimento',a=>cadastroDe(a.id).dataNascimento?fmtDateBR(cadastroDe(a.id).dataNascimento):''],['Idade',a=>idadeDe(cadastroDe(a.id).dataNascimento)??''],
    ['E-mail','email'],['WhatsApp','whatsapp'],['Instagram','instagram'],['Camiseta',a=>cadastroDe(a.id).tamanhoCamiseta],
    ['CEP','enderecoCep'],['Rua','enderecoRua'],['Número','enderecoNumero'],['Complemento','enderecoComplemento'],['Bairro','enderecoBairro'],['Cidade','enderecoCidade'],['UF','enderecoEstado'],
    ['Cupom','cupomYampi'],['Recebe comissão',a=>a.recebeComissao?'sim':'não'],['Chave PIX','pixKey'],
    ['Início parceria',a=>cadastroDe(a.id).inicioParceria?fmtDateBR(cadastroDe(a.id).inicioParceria):''],['Fim contrato',a=>cadastroDe(a.id).fimContrato?fmtDateBR(cadastroDe(a.id).fimContrato):''],
    ['Observações',a=>cadastroDe(a.id).observacoes]];
  const cel = (v)=>{ v = String(v ?? ''); if(/^[=+\-@]/.test(v)) v = "'" + v; return /[;"\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const linhas = [cols.map(c=>c[0]).join(';'), ...pessoas.map(a=> cols.map(([,k])=> cel(typeof k==='function' ? k(a) : a[k])).join(';'))];
  const blob = new Blob(['\ufeff' + linhas.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
  link.download = `cadastro-${State.categoria==='equipe'?'atletas':'profissionais'}-${todayISO()}.csv`; link.click();
  setTimeout(()=> URL.revokeObjectURL(link.href), 2000);
  toast(`${pessoas.length} cadastro(s) exportado(s)`);
}

function render(){
  document.getElementById('main').innerHTML = viewAtletas();
  document.getElementById('btnNovoAtleta').onclick = ()=> openAthleteModal(null);
  document.getElementById('btnExportar').onclick = exportarPlanilha;
  document.getElementById('btnNovaPasta').onclick = ()=> openPastaModal(null);
  document.querySelectorAll('[data-edit-team]').forEach(b=> b.onclick = (ev)=>{ ev.stopPropagation(); openPastaModal(b.dataset.editTeam); });
  document.querySelectorAll('[data-categoria]').forEach(b=> b.onclick = ()=>{ State.categoria = b.dataset.categoria; State.teamFilter = 'Todas'; render(); });
  document.querySelectorAll('[data-open-athlete]').forEach(el=>{
    el.onclick = (ev)=>{ if(ev.target.closest('a')) return; ev.stopPropagation(); openAthleteDrawer(State.athletes.find(x=>x.id===el.dataset.openAthlete)); };
  });
  document.querySelectorAll('[data-filter-team], [data-team]').forEach(el=>{
    el.onclick = ()=>{ const t = el.dataset.filterTeam || el.dataset.team; State.teamFilter = (State.teamFilter===t && el.dataset.team) ? 'Todas' : t; render(); };
  });
  const busca = document.getElementById('buscaAtleta');
  busca.oninput = ()=>{ State.busca = busca.value; const pos = busca.selectionStart; render(); const b2 = document.getElementById('buscaAtleta'); b2.focus(); b2.setSelectionRange(pos,pos); };
}

(async function start(){
  const auth = await guardStaff('atletas'); if(!auth) return;
  const [{ data }, teamsCheck, cad] = await Promise.all([
    sb.from('athletes').select('*').order('team').order('name'),
    sb.from('teams').select('id').limit(1),
    sb.from('atleta_cadastro').select('*'),
  ]);
  const [probeCompras, compras, prods] = await Promise.all([
    sb.from('atleta_cadastro').select('cupom_compras').limit(1),
    sb.from('atleta_compras').select('*'),
    sb.from('products').select('id, name, descricao').order('name'),
  ]);
  State.comprasOk = !probeCompras.error && !compras.error;
  State.feeOk = !(await sb.from('atleta_cadastro').select('fee_ativo').limit(1)).error;
  (compras.data||[]).forEach(r=> State.compras[r.athlete_id] = r);
  State.produtos = (prods.data || []).map(p=>({id:p.id, name:p.name, desc:p.descricao||''}));
  const ia = await sb.from('ia_acesso').select('*');
  State.iaTabela = !ia.error;
  (ia.data||[]).forEach(r=> State.iaAcesso[r.athlete_id] = {liberada:r.liberada, limite_mes:r.limite_mes});
  State.teamsTabela = !teamsCheck.error;
  State.cadastroTabela = !cad.error;
  (cad.data||[]).forEach(r=> State.cadastros[r.athlete_id] = mapCadastroFromDB(r));
  State.athletes = (data||[]).map(mapAthleteFromDB);
  await carregarHistorico();
  render();
})();
