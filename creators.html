<body class="cr">
<div class="bg-vivo" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app"><div class="login-wrap"><span class="loader-c"></span></div></div>
<div class="toast-c" id="toastC"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script src="creators-shared.js"></script>
<script src="creators-motion.js"></script>
<script>
/* Plataforma FourLab Creators — login e portal do creator (/creators).
   O login é criado pela equipe ao aprovar a inscrição (Edge Function criar-acesso-creator).
   O creator só lê os PRÓPRIOS dados: o banco filtra (policies "creator ve os proprios ..."). */
const $ = (id)=> document.getElementById(id);
function toastC(msg){ const t = $('toastC'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastC._h); toastC._h = setTimeout(()=> t.classList.remove('show'), 2600); }
const P = { creator:null, envios:[], semanas:[], entregas:[], calendario:[], sugestoes:[], aba:'inicio', calYm: todayISO().slice(0,7), diaSel: todayISO(), filtroSug:'' };

/* ---------- Login ---------- */
function telaLogin(){
  $('app').innerHTML = `<div class="login-wrap"><form class="glass login-card" id="formLogin">
    <a href="lpcreators"><img src="assets/creators/logo-fourlab.webp" alt="FourLab Nutrition" style="height:34px; width:auto; display:block; margin:0 auto;"></a>
    <img class="logo-creators" src="assets/creators/logo-creators.webp" alt="Creators">
    <p class="sub">Plataforma do creator. Entre com o usuário e a senha que o time FourLab te enviou.</p>
    <div class="fld"><label for="lUser">Usuário</label><input id="lUser" autocomplete="username" autocapitalize="off" placeholder="seu usuário"></div>
    <div class="fld"><label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password"></div>
    <button class="btn-c" type="submit" id="btnEntrar" style="width:100%; margin-top:6px;">Entrar</button>
    <div class="login-erro" id="loginErro"></div>
    <div class="rodape">Ainda não é creator? <a href="lpcreators">Conheça o programa</a></div>
  </form></div>`;
  $('formLogin').onsubmit = async (ev)=>{
    ev.preventDefault();
    const raw = $('lUser').value.trim(), senha = $('lSenha').value, erro = $('loginErro');
    erro.style.display = 'none';
    if(!raw || !senha){ erro.textContent = 'Preencha usuário e senha.'; erro.style.display = 'block'; return; }
    const email = raw.includes('@') ? raw : `${raw.toLowerCase()}@${DOMINIO_LOGIN_CREATORS}`;
    const btn = $('btnEntrar'); btn.disabled = true; btn.innerHTML = '<span class="loader-c"></span> Entrando...';
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    btn.disabled = false; btn.textContent = 'Entrar';
    if(error){ erro.textContent = 'Usuário ou senha incorretos.'; erro.style.display = 'block'; return; }
    iniciar();
  };
}
async function sair(){ await sb.auth.signOut(); P.creator = null; telaLogin(); }

/* ---------- Dados ---------- */
async function carregar(user){
  const { data: c, error } = await sb.from('creators').select('*').eq('auth_user_id', user.id).maybeSingle();
  if(error || !c) return false;
  P.creator = c;
  const [env, sem, cal, sug, ent] = await Promise.all([
    sb.from('creator_envios').select('*').eq('creator_id', c.id).order('created_at', {ascending:false}),
    sb.from('creator_semanas').select('*').eq('creator_id', c.id),
    sb.from('creator_calendario').select('*').order('data'),
    // o banco só devolve as publicadas pra "Todos" ou "Só creators" (migração parte 8)
    sb.from('sugestoes_conteudo').select('*').eq('publicada', true).order('fixada', {ascending:false}).order('created_at', {ascending:false}),
    sb.from('creator_entregas').select('*').eq('creator_id', c.id).order('created_at', {ascending:false}),
  ]);
  P.entregas = ent.error ? [] : (ent.data || []);
  P.envios = env.data || []; P.semanas = sem.data || []; P.calendario = cal.data || []; P.sugestoes = sug.error ? [] : (sug.data || []);
  return true;
}

/* ---------- Portal ---------- */
const ic = (nome)=> ICONS[nome].replace(/width="18" height="18"/, 'width="19" height="19"');
const ABAS = [
  {id:'inicio', label:'Início', ic:'inicio', desc:'Sua etapa no programa'},
  {id:'entregas', label:'Entregas', ic:'check', desc:'Suas entregas mínimas, semana a semana'},
  {id:'sugestoes', label:'Sugestões', ic:'ideia', desc:'Ideias de conteúdo pra você gravar'},

  };
}

        : '<div class="vazio">Seu cupom pessoal está sendo criado pelo time. Ele aparece aqui quando estiver ativo.</div>'}
    </section>
    <section class="glass card-c"><div class="desc" style="margin:0;">⚠️ Não publique preços, descontos, condições ou comissões sem confirmar com o time FourLab.</div></section>
  </div>`;
}
function eventosCalendario(){
  const c = P.creator, ev = P.calendario.slice(), et = etapaInfo(c.etapa), pr = progressoEtapa(c);
  // datas pessoais: início e fim da etapa atual
  if(pr){ ev.push({ id:'', data:c.etapa_inicio, titulo:`Início · ${et.curto}`, tipo:'etapa' }, { id:'', data:pr.fim, titulo:`Fim · ${et.curto} (avaliação)`, tipo:'etapa' }); }
  return ev;
}
function abaCalendario(){
  const ev = eventosCalendario(), doDia = eventosDoDia(ev, P.diaSel);
  return `<div class="p-grid">
    <section class="glass card-c">${calendarioMesHtml(ev, P.calYm, { max:2, comEtapa:true })}</section>
    <section class="glass card-c c6"><div class="sec-h"><div><h2>${escHtml(fmtDateBR(P.diaSel))}</h2><div class="desc">Clique num dia do calendário pra ver o que tem nele</div></div></div>
      <div class="lista-c">${doDia.length ? doDia.map(dataHtml).join('') : '<div class="vazio">Nada marcado neste dia.</div>'}</div></section>
    ${proximasDatasHtml(5, 'c6')}
  </div>`;
}
function abaSugestoes(){
  const tipos = [...new Set(P.sugestoes.map(x=> x.tipo))];
  const lista = P.sugestoes.filter(x=> !P.filtroSug || x.tipo === P.filtroSug);
  if(!P.sugestoes.length) return `<section class="glass card-c"><h2>Sugestões de conteúdo</h2><div class="vazio" style="margin-top:8px;">Em breve o time FourLab publica aqui ideias de conteúdo prontas pra você gravar.</div></section>`;
  return `<div class="filtros"><button data-fsug="" class="${!P.filtroSug?'active':''}">Todas</button>${tipos.map(t=>`<button data-fsug="${escHtml(t)}" class="${P.filtroSug===t?'active':''}">${tipoSugestao(t).emoji} ${escHtml(tipoSugestao(t).curto||tipoSugestao(t).label)}</button>`).join('')}</div>
    <div class="sug-grid">${lista.map((x, i)=>{ const t = tipoSugestao(x.tipo), capa = capaDaSugestao(x), dif = SUGESTAO_DIFICULDADE[x.dificuldade] || SUGESTAO_DIFICULDADE.facil;
      return `<article class="glass sug" data-sug="${x.id}" tabindex="0">
        <div class="capa" ${capa ? `style="background-image:url('${escHtml(capa)}')"` : ''}>${capa ? '' : t.emoji}
          <div class="tags"><span class="tag">${t.emoji} ${escHtml(t.curto||t.label)}</span>${x.fixada?'<span class="tag hot">📌 Destaque</span>':''}</div></div>
        <div class="corpo"><div class="tt">${escHtml(x.titulo||'Sem título')}</div>${x.objetivo?`<div class="ds">${escHtml(x.objetivo)}</div>`:''}
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:8px;"><span class="tag">${dif.label}</span>${x.produto?`<span class="tag">${escHtml(x.produto)}</span>`:''}</div></div>
      </article>`; }).join('')}</div>`;
}
function abrirSugestao(id){
  const x = P.sugestoes.find(s=> s.id === id); if(!x) return;
  const t = tipoSugestao(x.tipo), dif = SUGESTAO_DIFICULDADE[x.dificuldade] || SUGESTAO_DIFICULDADE.facil, passos = passosDaSugestao(x);
  const refs = String(x.referencias||'').split('\n').map(l=>l.trim()).filter(Boolean);
  $('modalCaixa').innerHTML = `<button class="fechar" id="fecharModal" aria-label="Fechar">&times;</button>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;"><span class="tag hot">${t.emoji} ${escHtml(t.label)}</span><span class="tag">${dif.label}</span>${x.produto?`<span class="tag">${escHtml(x.produto)}</span>`:''}</div>
    <h2 style="font-size:clamp(22px, 3.4vw, 32px); padding-right:40px;">${escHtml(x.titulo||'Sem título')}</h2>
    ${x.objetivo ? `<p style="color:var(--c-muted); margin:10px 0 0;">${escHtml(x.objetivo)}</p>` : ''}
    ${passos.length ? `<div class="sec-mini">Passo a passo · ${passos.length} ${passos.length===1 ? t.passo.toLowerCase() : t.plural}</div>
      <div class="telas">${passos.map((p, i)=>`<div class="tela"><div class="img" style="aspect-ratio:${t.proporcao}; ${p.imagem?`background-image:url('${escHtml(p.imagem)}')`:''}">${p.imagem?'':`${t.passo} ${i+1}`}</div>
        <div class="tx"><b>${t.passo} ${i+1}</b>${p.texto?`<div style="margin-top:4px;">${escHtml(p.texto)}</div>`:''}${p.dica?`<div class="dica">💡 ${escHtml(p.dica)}</div>`:''}</div></div>`).join('')}</div>` : ''}
    ${x.roteiro ? `<div class="sec-mini" style="display:flex; justify-content:space-between; align-items:center;">Roteiro / texto <button class="btn-c sm ghost" id="copiarRoteiro">Copiar</button></div><div class="roteiro-c">${textoRicoHtml(x.roteiro)}</div>` : ''}
    ${refs.length ? `<div class="sec-mini">Inspirações</div>${refs.map(r=> /^https?:\/\//.test(r) ? `<div style="margin:4px 0;"><a href="${escHtml(r)}" target="_blank" rel="noopener">🔗 ${escHtml(r.replace(/^https?:\/\/(www\.)?/,''))}</a></div>` : `<div style="margin:4px 0;">• ${escHtml(r)}</div>`).join('')}` : ''}
    <div style="margin-top:22px; font-size:12.5px; color:var(--c-muted);">Lembre do <a href="#manual">manual da marca</a> e das hashtags #creatorFourLab #FourLabNutri.</div>`;
  $('modalC').classList.add('on');
  const fechar = ()=> $('modalC').classList.remove('on');
  $('fecharModal').onclick = fechar;
  $('modalC').onclick = (e)=>{ if(e.target.id === 'modalC') fechar(); };
  const cr = $('copiarRoteiro'); if(cr) cr.onclick = ()=> navigator.clipboard.writeText(x.roteiro).then(()=> toastC('Roteiro copiado!'));
}
function abaManual(){
  const c = P.creator;
  return `<div class="p-grid manual">
    <section class="glass card-c c6"><h3>🎥 O que mostrar</h3>
      <ul><li>Preparação para os treinos</li><li>O que leva para uma prova</li><li>Organização da mochila, bike ou equipamentos</li>
        <li>Uso dos produtos antes, durante ou depois do treino</li><li>Sua experiência com os sabores, praticidade e preparo</li>
        <li>Bastidores e dúvidas da sua comunidade</li><li>Como organiza sua estratégia de hidratação e carboidratos</li></ul>
      <div class="destaque">Não queremos transformar o seu perfil em um catálogo da FourLab. Queremos ver o seu esporte, a sua rotina inserida naturalmente na sua história.</div></section>
    <section class="glass card-c c6"><h3>⚠️ Termos proibidos</h3>
      <ul><li>Não faça promessas de resultados que o produto não oferece.</li><li>Não diga que o produto garante melhora de performance.</li>
        <li>Não invente benefícios.</li><li>Não altere informações nutricionais ou técnicas.</li>
        <li>Não atribua ao produto prevenção, tratamento ou cura de doenças.</li><li>Não crie protocolos ou recomendações técnicas sem respaldo.</li>
        <li>Não recomende o produto para tratar sintomas ou condições de saúde.</li><li>Não apresente como experiência própria algo que você não viveu.</li>
        <li>Não compare a FourLab com concorrentes sem autorização.</li><li>Não publique preços, descontos, condições ou comissões sem confirmar.</li></ul>
      <div class="destaque">Se tiver dúvida sobre uma informação, pergunte ao time FourLab antes de publicar.</div></section>
    <section class="glass card-c c6"><h3>📱 Padrão das gravações</h3>
      <ul><li>Grave preferencialmente em formato vertical 9:16.</li><li>Priorize boa iluminação.</li><li>Utilize áudio claro.</li>
        <li>Evite vento e ruídos excessivos.</li><li>Mostre a embalagem corretamente.</li><li>Deixe a marca visível quando o produto estiver em destaque.</li>
        <li>Adicione na edição legendas quando houver fala.</li><li>Evite filtros que alterem as cores da embalagem.</li>
        <li>Não utilize marca d'água de outra plataforma.</li><li>Preserve o seu estilo de conteúdo.</li></ul></section>
    <section class="glass card-c c6"><h3>🤝 Identificação da parceria</h3>
      <p style="margin:0 0 10px; font-size:14.5px;">Quando o conteúdo envolver recebimento de produto, comissão, cupom ou qualquer benefício, siga as orientações de identificação publicitária da plataforma e do time FourLab.</p>
      <p style="margin:0; font-size:14.5px;">Quando aplicável, use as ferramentas de parceria paga e as hashtags:</p>
      <div style="font-family:var(--c-font-title); font-weight:800; font-size:18px; margin-top:10px;"><span class="grad-text">#creatorFourLab</span> &nbsp; <span class="grad-text">#FourLabNutri</span></div>
      <div class="destaque">A recomendação deve ser transparente para a sua comunidade.</div></section>
    ${c.etapa==='etapa2' || P.semanas.some(s=>s.etapa==='etapa2') ? `<section class="glass card-c"><h3>💬 Conteúdo de comunidade (Etapa 02)</h3>
      <ul><li>Caixa de perguntas</li><li>Enquete sobre sabores</li><li>Resposta a uma dúvida real</li><li>Comentário sobre o produto depois do treino</li>
        <li>Demonstração do preparo</li><li>Recomendação baseada na sua própria experiência</li><li>Lembrete do seu cupom quando fizer sentido</li></ul>
      <div class="destaque">Em vez de dizer "esse produto vai melhorar sua performance", explique como ele entrou na sua rotina e qual foi a sua experiência pessoal.</div></section>` : ''}
    <section class="glass card-c"><h3>📘 Guias em PDF</h3><div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn-c sm ghost" href="assets/creators/programa-creators.pdf" target="_blank" rel="noopener">Programa Creators</a>
      <a class="btn-c sm ghost" href="assets/creators/guia-etapa-01.pdf" target="_blank" rel="noopener">Guia Etapa 01</a>
      ${['etapa2','oficial'].includes(c.etapa) ? '<a class="btn-c sm ghost" href="assets/creators/guia-etapa-02.pdf" target="_blank" rel="noopener">Guia Etapa 02</a>' : ''}</div></section>
  </div>`;
}

function render(){
  const abas = {inicio:abaInicio, entregas:abaEntregas, sugestoes:abaSugestoes, envios:abaEnvios, cupons:abaCupons, calendario:abaCalendario, manual:abaManual};
  document.body.classList.add('portal'); document.body.classList.remove('menu-aberto');
  $('app').innerHTML = shell((abas[P.aba]||abaInicio)());
  $('btnSair').onclick = sair;
  $('btnMenu').onclick = ()=> document.body.classList.add('menu-aberto');
  $('pFundo').onclick = ()=> document.body.classList.remove('menu-aberto');
  document.querySelectorAll('[data-cal-nav]').forEach(b=> b.onclick = ()=>{ P.calYm = addMonths(P.calYm, Number(b.dataset.calNav)); render(); });
  document.querySelectorAll('[data-cal-dia]').forEach(b=> b.onclick = ()=>{ P.diaSel = b.dataset.calDia; render(); });
  const sel = document.querySelector(`[data-cal-dia="${P.diaSel}"]`); if(sel) sel.classList.add('sel');
  document.querySelectorAll('[data-fsug]').forEach(b=> b.onclick = ()=>{ P.filtroSug = b.dataset.fsug; render(); });
  document.querySelectorAll('[data-sug]').forEach(el=>{ el.onclick = ()=> abrirSugestao(el.dataset.sug); el.onkeydown = (e)=>{ if(e.key==='Enter') abrirSugestao(el.dataset.sug); }; });
  document.querySelectorAll('[data-copiar]').forEach(b=> b.onclick = ()=> navigator.clipboard.writeText(b.dataset.copiar).then(()=> toastC('Copiado!')));
  document.querySelectorAll('[data-registrar]').forEach(b=> b.onclick = ()=> abrirRegistro(b.dataset.registrar));
  document.querySelectorAll('[data-apagar-ent]').forEach(b=> b.onclick = async ()=>{
    if(!confirm('Apagar este registro?')) return;
    const { error } = await sb.from('creator_entregas').delete().eq('id', b.dataset.apagarEnt);
    if(error){ toastC('Não foi possível apagar.'); return; }
    P.entregas = P.entregas.filter(e=> e.id !== b.dataset.apagarEnt); render();
  });
  document.querySelectorAll('[data-receber]').forEach(b=> b.onclick = async ()=>{
    b.disabled = true;
    const { error } = await sb.rpc('confirmar_recebimento_kit', { p_envio: b.dataset.receber });
    if(error){ b.disabled = false; toastC(error.message || 'Não foi possível confirmar.'); return; }
    const e = P.envios.find(x=> x.id === b.dataset.receber); if(e){ e.status = 'entregue'; e.entregue_em = todayISO(); }
    toastC('Recebimento confirmado! Bons treinos 🧡'); CrMotion.confete(); render();
  });
  const fc = $('formCupom');
  if(fc) fc.onsubmit = async (ev)=>{
    ev.preventDefault();
    const nome = $('cupomNome').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(nome.length < 4 || nome.length > 20){ toastC('Use de 4 a 20 letras ou números.'); return; }
    const { error } = await sb.rpc('sugerir_meu_cupom', { p_cupom: nome });
    if(error){ toastC(error.message || 'Não foi possível enviar.'); return; }
    P.creator.cupom_desconto_sugerido = nome; toastC('Pedido enviado! O time vai ativar seu cupom.'); render();
  };
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', ()=>{ if(!P.creator) return; P.aba = location.hash.slice(1) || 'inicio'; render(); });

async function iniciar(){
  const user = await getSessionUser();
  if(!user){ telaLogin(); return; }
  const profile = await loadProfile(user.id);
  if(profile.role !== 'creator'){ location.href = paginaInicialDoPerfil(profile); return; }
  if(!(await carregar(user))){
    $('app').innerHTML = `<div class="login-wrap"><div class="glass login-card"><h2 style="font-size:22px;">Acesso sem cadastro</h2>
      <p class="sub" style="margin-top:10px;">Seu login existe, mas não está ligado a um cadastro do Programa Creators. Fale com o time FourLab.</p>
      <button class="btn-c ghost" id="btnSair2">Sair</button></div></div>`;
    $('btnSair2').onclick = sair; return;
  }
  P.aba = (location.hash.slice(1) && ABAS.some(a=>a.id===location.hash.slice(1))) ? location.hash.slice(1) : 'inicio';
  render();
}
iniciar();
</script>
</body></html>
