<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home · FourLab</title>
<meta name="description" content="Painel FourLab para atletas e parceiros: roteiros de conteúdo, vendas do cupom e perfil em um só lugar.">
<meta name="theme-color" content="#140e10">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="FourLab">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FourLab">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Painel dos atletas FourLab">
<meta property="og:description" content="Seus roteiros, suas vendas e seu cupom em um só lugar.">
<meta property="og:url" content="https://atleta.fourlabnutrition.com.br/">
<meta property="og:image" content="https://atleta.fourlabnutrition.com.br/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Painel dos atletas FourLab">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://atleta.fourlabnutrition.com.br/assets/og-image.jpg">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="shell" id="appShell">
  <div id="sidebarMount"></div>
  <main id="main"><div class="empty-state"><span class="loader" style="border-top-color:var(--orange);border-color:rgba(0,0,0,0.1);"></span></div></main>
</div>

<div id="modalBg" class="modal-bg"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
const State = { athletes:[], cycles:{}, currentCycleYM: monthKey(todayISO()), exemplosBonsCache: null, profile:null };

function daysInMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function athleteName(id){ const a = State.athletes.find(x=>x.id===id); return a?a.name:'(removido)'; }
function mapEntryFromDB(r){
  return {
    id:r.id, athleteId:r.athlete_id, team:r.team, product:r.product, theme:r.theme,
    format:r.format, date:r.post_date, roteiro:r.roteiro||'',
    status:{
      postou:r.postou, collab:r.collab, obs:r.obs||'',
      metrics:{views:r.metric_views||0, likes:r.metric_likes||0, comments:r.metric_comments||0, shares:r.metric_shares||0, saves:r.metric_saves||0}
    }
  };
}
function getOrCreateCycle(ym){
  if(!State.cycles[ym]){
    State.cycles[ym] = {ym, id:null, themeGeral:'', trendsNotes:'', briefingText:'', briefingFileUrl:'', briefingFileName:'', entries:[]};
  }
  return State.cycles[ym];
}

async function carregarMes(ym){
  const { data: cycleRow } = await sb.from('cycles').select('*').eq('ym', ym).maybeSingle();
  if(!cycleRow){
    State.cycles[ym] = {ym, id:null, themeGeral:'', trendsNotes:'', briefingText:'', briefingFileUrl:'', briefingFileName:'', entries:[]};
    return;
  }
  const { data: entriesData } = await sb.from('entries').select('*').eq('cycle_id', cycleRow.id);
  State.cycles[ym] = {
    ym, id:cycleRow.id, themeGeral:cycleRow.theme_geral||'', trendsNotes:cycleRow.trends_notes||'',
    briefingText:cycleRow.briefing_text||'', briefingFileUrl:cycleRow.briefing_file_url||'', briefingFileName:cycleRow.briefing_file_name||'',
    entries: (entriesData||[]).map(mapEntryFromDB)
  };
}

async function buscarExemplosBons(limit){
  const { data } = await sb.from('roteiro_exemplos').select('roteiro_text, team, produto, formato')
    .eq('tipo', 'bom').order('created_at', {ascending:false}).limit(limit||3);
  return data || [];
}

function calendarGridHtml(ym){
  const cycle = getOrCreateCycle(ym);
  const nDays = daysInMonth(ym);
  const [y,m] = ym.split('-').map(Number);
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const byDay = {};
  cycle.entries.forEach(e=>{
    const day = Number(e.date.split('-')[2]);
    (byDay[day] = byDay[day] || []).push(e);
  });
  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=nDays; d++){
    const items = byDay[d] || [];
    cells += `<div class="cal-cell">
      <div class="cal-day">${d}</div>
      ${items.map(e=>`<div class="cal-chip team-${(e.team||'').replace(/\s/g,'')}" title="${e.product}">${athleteName(e.athleteId)}</div>`).join('')}
    </div>`;
  }
  return `
    <style>
      .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px;}
      .cal-head{font-size:10.5px; font-weight:800; color:var(--muted); text-align:center; text-transform:uppercase; padding-bottom:4px;}
      .cal-cell{min-height:78px; border:1px solid #f1ebe4; border-radius:12px; padding:6px; background:var(--surface-2);}
      .cal-cell.empty{border:none; background:transparent;}
      .cal-day{font-size:10.5px; font-weight:700; color:var(--muted); margin-bottom:3px;}
      .cal-chip{font-size:10px; font-weight:700; padding:2px 5px; border-radius:5px; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    </style>
    <div class="cal-grid">
      ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-head">${d}</div>`).join('')}
      ${cells}
    </div>`;
}

function computeDashboardStats(ym){
  const cycle = getOrCreateCycle(ym);
  const entries = cycle.entries || [];
  const stats = { total: entries.length, postouSim:0, postouNao:0, postouPendente:0,
    views:0, likes:0, comments:0, shares:0, saves:0, byTeam:{}, byFormat:{'Vídeo':0,'Carrossel':0}, topAtletas:[] };
  entries.forEach(e=>{
    const s = e.status || {};
    if(s.postou==='sim') stats.postouSim++;
    else if(s.postou==='nao') stats.postouNao++;
    else stats.postouPendente++;
    const met = s.metrics || {};
    stats.views += Number(met.views)||0; stats.likes += Number(met.likes)||0;
    stats.comments += Number(met.comments)||0; stats.shares += Number(met.shares)||0; stats.saves += Number(met.saves)||0;
    stats.byTeam[e.team] = (stats.byTeam[e.team]||0) + 1;
    stats.byFormat[e.format] = (stats.byFormat[e.format]||0) + 1;
    stats.topAtletas.push({name:athleteName(e.athleteId), views:Number(met.views)||0});
  });
  stats.topAtletas.sort((a,b)=>b.views-a.views);
  stats.topAtletas = stats.topAtletas.slice(0,5).filter(a=>a.views>0);
  return stats;
}

function barChartHtml(data){
  const max = Math.max(1, ...data.map(d=>d.value));
  return `<div style="display:flex; flex-direction:column; gap:8px;">
    ${data.map(d=>`
      <div>
        <div style="display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:3px;">
          <span style="font-weight:700;">${d.label}</span><span style="color:var(--muted);">${d.value}</span>
        </div>
        <div style="background:var(--surface-2); border-radius:999px; height:10px; overflow:hidden;">
          <div style="width:${(d.value/max*100)}%; height:100%; background:${d.color||'var(--orange)'}; border-radius:999px;"></div>
        </div>
      </div>`).join('')}
  </div>`;
}

function viewHome(){
  const ym = State.currentCycleYM;
  const stats = computeDashboardStats(ym);
  const teamData = Object.keys(stats.byTeam).map(t=>({label:t, value:stats.byTeam[t], color:teamColor(t)}));
  const taxaPostagem = stats.total ? Math.round((stats.postouSim/stats.total)*100) : 0;

  // se o nome do perfil for um e-mail, usa só a parte antes do @ (ex.: "Marketing")
  const bruto = (State.profile?.nome || '').trim();
  const base = bruto.includes('@') ? bruto.split('@')[0].replace(/[._-]+/g,' ') : bruto;
  const nome = base.split(' ')[0].replace(/^./, c=>c.toUpperCase());
  return `
  <div class="page-head">
    <div><h1>Bem-vindo de volta${nome?`, <span class="soft">${escHtml(nome)}</span>`:''}</h1><div class="sub">${stats.total} posts em ${fmtMonthLabel(ym)}.</div></div>
    <div class="input-ic"><span class="ic">${ICONS.calendar}</span><input type="month" id="homeMonth" value="${ym}" style="width:auto; background:#fff;"></div>
  </div>

  <div id="homeFees"></div>

  <div class="grid-4" style="margin-bottom:18px;">
    <div class="card kpi"><div class="row" style="justify-content:space-between;"><div class="kpi-label">Posts agendados</div><span class="ic-bubble">${ICONS.roteiro}</span></div>
      <div class="kpi-value">${stats.total}</div></div>
    <div class="card kpi"><div class="row" style="justify-content:space-between;"><div class="kpi-label">Postagem confirmada</div><span class="ic-bubble">${ICONS.check}</span></div>
      <div class="kpi-value" style="color:var(--orange);">${taxaPostagem}%</div>
      <div class="progress" style="margin-top:10px; height:8px;"><div style="width:${taxaPostagem}%;"></div></div></div>
    <div class="card kpi"><div class="row" style="justify-content:space-between;"><div class="kpi-label">Visualizações somadas</div><span class="ic-bubble">${ICONS.trend}</span></div>
      <div class="kpi-value">${stats.views.toLocaleString('pt-BR')}</div></div>
    <div class="card kpi"><div class="row" style="justify-content:space-between;"><div class="kpi-label">Pendentes de confirmação</div><span class="ic-bubble">${ICONS.flag}</span></div>
      <div class="kpi-value">${stats.postouPendente}</div>
      <div class="kpi-foot"><a href="acompanhamento" style="color:var(--orange); font-weight:700; text-decoration:none;">Ir pro acompanhamento →</a></div></div>
  </div>

  <div class="panel">
    <div class="card-head"><div class="card-title-ic"><span class="ic-bubble">${ICONS.calendar}</span><div><h2>Calendário — ${fmtMonthLabel(ym)}</h2><div class="desc">Quem posta em cada dia</div></div></div>
      <a class="icon-btn" href="ciclo" title="Abrir Mês / Roteiros">${ICONS.arrow}</a></div>
    ${calendarGridHtml(ym)}
  </div>

  <div class="grid-2" style="margin-bottom:18px;">
    <div class="panel">
      <h2>Posts por equipe</h2>
      ${teamData.length ? barChartHtml(teamData) : '<div class="desc">Sem posts agendados ainda este mês.</div>'}
    </div>
    <div class="panel">
      <h2>Engajamento somado</h2>
      ${barChartHtml([
        {label:'Curtidas', value:stats.likes, color:'var(--orange)'},
        {label:'Comentários', value:stats.comments, color:'var(--pink)'},
        {label:'Compartilhamentos', value:stats.shares, color:'var(--purple)'},
        {label:'Salvos', value:stats.saves, color:'var(--yellow)'},
      ])}
    </div>
  </div>

  ${stats.topAtletas.length ? `
  <div class="panel">
    <h2>Top 5 atletas — visualizações</h2>
    ${barChartHtml(stats.topAtletas.map(a=>({label:a.name, value:a.views, color:'var(--orange)'})))}
  </div>` : ''}

  <div class="panel">
    <h2>🏆 Posts campeões</h2>
    <div class="desc">Roteiros marcados como bom exemplo (👍) na aba de roteiros — servem de referência e alimentam a geração dos próximos.</div>
    ${State.exemplosBonsCache === null ? '<div style="color:var(--muted); font-size:12px; margin-top:10px;">Carregando...</div>' :
      (State.exemplosBonsCache.length === 0 ? '<div style="color:var(--muted); font-size:12px; margin-top:10px;">Nenhum exemplo marcado ainda.</div>' :
      State.exemplosBonsCache.map(ex=>`
        <div style="border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px;">
          <div style="font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:4px;">${ex.team||'—'} · ${ex.produto||'—'} · ${ex.formato||'—'}</div>
          <div style="font-size:12px; white-space:pre-wrap; max-height:80px; overflow:hidden;">${(ex.roteiro_text||'').slice(0,260)}${ex.roteiro_text&&ex.roteiro_text.length>260?'...':''}</div>
        </div>
      `).join(''))}
  </div>`;
}

async function render(){
  document.getElementById('main').innerHTML = viewHome();
  // aviso automático de pagamento de fee (só aparece se alguém tiver fee mensal no cadastro)
  iniciarBlocoFees('homeFees', State.currentCycleYM, State.athletes, { link:'vendas' });
  const monthInput = document.getElementById('homeMonth');
  monthInput.onchange = async ()=>{
    State.currentCycleYM = monthInput.value;
    document.getElementById('main').innerHTML = `<div class="empty-state"><span class="loader"></span></div>`;
    await carregarMes(State.currentCycleYM);
    render();
  };
}

(async function start(){
  const auth = await guardStaff('home');
  if(!auth) return;
  State.profile = auth.profile;
  const { data: athletesData } = await sb.from('athletes').select('*').order('team').order('name');
  State.athletes = (athletesData||[]).map(mapAthleteFromDB);
  await carregarMes(State.currentCycleYM);
  render();
  buscarExemplosBons(6).then(data=>{ State.exemplosBonsCache = data; render(); });
})();
</script>
</body>
</html>
