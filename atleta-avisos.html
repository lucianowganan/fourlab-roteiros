<div class="shell" id="appShell"><div id="sidebarMount"></div>
<main id="main"><div class="empty-state"><span class="loader" style="border-top-color:var(--orange);border-color:rgba(0,0,0,0.1);"></span></div></main></div>
<div id="modalBg" class="modal-bg"><div id="modalBox" class="modal-box"></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
/* Avisos da FourLab pro atleta/parceiro. O banco só devolve os avisos do público dele
   (todos + atletas ou profissionais) — os internos da administração nunca chegam aqui. */
(async function start(){
  const auth = await guardAthlete('avisos'); if(!auth) return;
  const vistoAntes = avisosVistosEm();
  const { data } = await sb.from('avisos').select('*').order('fixado', {ascending:false}).order('created_at', {ascending:false});
  const avisos = (data||[]).filter(a=> a.publico !== 'equipe'); // redundante com o banco, por garantia
  marcarAvisosComoVistos();
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h1>Avisos</h1><div class="sub">Comunicados da FourLab pra você.</div></div></div>
    ${avisos.length ? `<div style="display:flex; flex-direction:column; gap:14px; max-width:760px;">${avisos.map(av=> avisoCardHtml(av, {novo: vistoAntes && av.created_at > vistoAntes})).join('')}</div>`
      : '<div class="panel"><div class="empty-state"><div class="big">📭</div>Nenhum aviso por enquanto.</div></div>'}`;
})();
</script></body></html>
