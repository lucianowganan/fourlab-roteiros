<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideias pra gravar · FourLab</title>
<meta name="description" content="Painel FourLab para atletas e parceiros: roteiros de conteúdo, vendas do cupom e perfil em um só lugar.">
<meta name="theme-color" content="#140e10">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="FourLab">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FourLab">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Painel dos atletas FourLab">
<meta property="og:description" content="Seus roteiros, suas vendas e seu cupom em um só lugar.">
<meta property="og:url" content="https://atleta.fourlabnutrition.com.br/">
<meta property="og:image" content="https://atleta.fourlabnutrition.com.br/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Painel dos atletas FourLab">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://atleta.fourlabnutrition.com.br/assets/og-image.jpg">
<link rel="stylesheet" href="shared.css"></head><body>
<div class="shell" id="appShell"><div id="sidebarMount"></div>
<main id="main"><div class="empty-state"><span class="loader" style="border-top-color:var(--orange);border-color:rgba(0,0,0,0.1);"></span></div></main></div>
<div id="modalBg" class="modal-bg"><div id="modalBox" class="modal-box"></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
/* Ideias pra gravar: sugestões de conteúdo que a FourLab publica (reels, stories, carrosséis...).
   O banco só devolve as publicadas pro público da pessoa (atletas / profissionais / todos).
   A pessoa marca "quero gravar" e "já gravei" (com o link do post) — base da futura gamificação. */
const MIGRACAO = 'migrations/2026-10-06b_sugestoes_conteudo.sql';
const MIGRACAO_IA = 'migrations/2026-10-07_ia_sugestoes.sql';
const State = { athlete:null, sugestoes:[], minhas:{}, filtro:'todas', tabelaOk:true, acessoIa:null, pedidosIa:[], produtos:[] };

async function carregar(){
  const [sug, grav] = await Promise.all([
    sb.from('sugestoes_conteudo').select('*').eq('publicada', true).order('fixada', {ascending:false}).order('created_at', {ascending:false}),
    sb.from('sugestao_gravacoes').select('*').eq('athlete_id', State.athlete.id),
  ]);
  State.tabelaOk = !sug.error; State.sugestoes = sug.data || [];
  State.minhas = {}; (grav.data||[]).forEach(g=> State.minhas[g.sugestao_id] = g);
  // IA de ideias: só aparece pra quem a equipe liberou
  const [ac, ped, prod] = await Promise.all([
    sb.from('ia_acesso').select('*').eq('athlete_id', State.athlete.id).maybeSingle(),
    sb.from('ia_pedidos').select('*').eq('athlete_id', State.athlete.id).order('created_at', {ascending:false}),
    sb.from('products').select('name').order('name'),
  ]);
  State.acessoIa = ac.data || null; State.pedidosIa = ped.data || []; State.produtos = (prod.data||[]).map(p=>p.name);
}

/* ---------- IA de ideias ---------- */
const iaLiberada = ()=> !!State.acessoIa?.liberada;
function iaUsadosNoMes(){ const ym = new Date().toISOString().slice(0,7); return State.pedidosIa.filter(p=> String(p.created_at).slice(0,7)===ym && p.status!=='erro').length; }
function iaRestantes(){ return Math.max(0, (State.acessoIa?.limite_mes||0) - iaUsadosNoMes()); }
const ideiasIa = ()=> State.pedidosIa.filter(p=> p.status==='ok' && p.resultado?.titulo);
function ideiaIaComoSugestao(p){ const r = p.resultado||{}; return {...r, id:p.id, tipo:r.tipo||p.tipo, publicada:true, passos:r.passos||[], ia:true, avaliacao:p.avaliacao}; }
function cardIaHtml(){
  if(!iaLiberada()) return '';
  const rest = iaRestantes(), lim = State.acessoIa.limite_mes;
  return `<div class="card" style="margin-bottom:18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; background:linear-gradient(135deg,#fff7ef,#fff);">
    <span class="ic-bubble" style="background:var(--grad-accent); color:#fff;">✨</span>
    <div style="flex:1; min-width:200px;"><div style="font-family:var(--font-title); font-weight:700; font-size:16px;">Peça uma ideia à IA da FourLab</div>
      <div style="font-size:12.5px; color:var(--muted); margin-top:2px;">Diga o formato e o que quer mostrar: ela monta o passo a passo pra você gravar. ${rest} de ${lim} ideias restantes este mês.</div></div>
    <button class="btn btn-primary" id="btnPedirIa" ${rest?'':'disabled'}>${rest ? '✨ Pedir ideia' : 'Limite do mês atingido'}</button></div>`;
}
function abrirPedirIa(){
  openModal(`<button class="modal-close" id="modalCloseBtn">&times;</button><h3>✨ Pedir ideia à IA</h3>
    ${iaFormHtml({produtos:State.produtos})}
    <div id="iaErro" style="font-size:12.5px; color:var(--red); margin-bottom:8px;"></div>
    <div class="row" style="justify-content:space-between; gap:10px;"><span style="font-size:12px; color:var(--muted);">Restam ${iaRestantes()} de ${State.acessoIa.limite_mes} este mês</span>
      <button class="btn btn-primary" id="btnIaGerar">✨ Criar ideia</button></div>`, {largo:true});
  document.getElementById('modalCloseBtn').onclick = closeModal;
  const ler = ligarIaForm();
  document.getElementById('btnIaGerar').onclick = async (ev)=>{
    const btn = ev.currentTarget; botaoCarregandoIA(btn); document.getElementById('iaErro').textContent = '';
    const dados = ler();
    try{
      const r = await gerarSugestaoIA(dados);
      const p = {id:r.pedidoId, athlete_id:State.athlete.id, tipo:dados.tipo, produto:r.sugestao.produto, pedido:dados.pedido, status:'ok', resultado:r.sugestao, avaliacao:null, created_at:new Date().toISOString()};
      State.pedidosIa.unshift(p); render(); abrirIdeiaIa(p.id);
    }catch(err){
      if(err.restantes != null) State.pedidosIa.unshift({id:'x'+Date.now(), status:'recusado', created_at:new Date().toISOString()});  // recusa conta no limite
      document.getElementById('iaErro').textContent = err.message; btn.disabled = false; btn.innerHTML = '✨ Tentar de novo';
      render();
    }
  };
}
function abrirIdeiaIa(id){
  const p = State.pedidosIa.find(x=>x.id===id); if(!p) return;
  const s = ideiaIaComoSugestao(p);
  const textoTudo = [s.titulo, s.objetivo, ...(s.passos||[]).map((x,i)=>`${tipoSugestao(s.tipo).passo} ${i+1}: ${x.texto}${x.dica?` (${x.dica})`:''}`), s.roteiro].filter(Boolean).join('\n\n');
  openModal(`<button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="badge" style="background:var(--grad-accent); color:#fff; margin-bottom:8px;">✨ Ideia criada pela IA pra você</div>
    ${sugestaoDetalheHtml(s)}
    <div style="margin-top:20px; border-top:1px solid #f3eee8; padding-top:16px;">
      <div style="font-size:12.5px; font-weight:700; margin-bottom:8px;">Essa ideia ficou boa? Sua avaliação ajuda a IA a melhorar.</div>
      <div class="row" style="gap:8px;">
        <button class="btn ${p.avaliacao==='bom'?'btn-primary':'btn-ghost'}" data-avaliar="bom">👍 Ficou boa</button>
        <button class="btn ${p.avaliacao==='ruim'?'btn-dark':'btn-ghost'}" data-avaliar="ruim">👎 Não curti</button>
        <button class="btn btn-ghost" id="btnCopiarTudo" style="margin-left:auto;">${ICONS.copy.replace('width="18" height="18"','width="13" height="13"')} Copiar tudo</button></div>
      ${p.motivo?`<div style="font-size:12px; color:var(--muted); margin-top:6px;">Seu comentário: ${escHtml(p.motivo)}</div>`:''}</div>`, {largo:true});
  document.getElementById('modalCloseBtn').onclick = closeModal;
  document.querySelectorAll('[data-copiar-roteiro-sug]').forEach(b=> b.onclick = ()=> navigator.clipboard.writeText(s.roteiro||'').then(()=> toast('Roteiro copiado')));
  document.getElementById('btnCopiarTudo').onclick = ()=> navigator.clipboard.writeText(textoTudo).then(()=> toast('Ideia copiada'));
  document.querySelectorAll('[data-avaliar]').forEach(b=> b.onclick = async ()=>{
    const av = b.dataset.avaliar;
    let motivo = '';
    if(av==='ruim'){ motivo = prompt('O que não ficou bom? (opcional — ajuda a IA)', p.motivo||''); if(motivo===null) return; }
    const { error } = await sb.rpc('avaliar_minha_ideia_ia', { p_id:p.id, p_avaliacao:av, p_motivo:motivo });
    if(error){ erroBanco(error, MIGRACAO_IA); return; }
    p.avaliacao = av; p.motivo = motivo; toast(av==='bom' ? 'Valeu! 👍' : 'Valeu pelo retorno!'); abrirIdeiaIa(p.id); render();
  });
}

function seloMinha(s){
  const g = State.minhas[s.id]; if(!g) return '';
  return g.status==='gravei' ? '<div class="sug-selo" style="background:var(--green-soft); color:var(--green);">✅ Você gravou</div>'
                             : '<div class="sug-selo" style="background:var(--orange-soft); color:#b5480a;">🙋 Na sua lista</div>';
}

function view(){
  if(!State.tabelaOk) return `<div class="page-head"><div><h1>Ideias pra gravar</h1></div></div><div class="panel"><div class="empty-state"><div class="big">🛠️</div>Esta área ainda está sendo preparada pela FourLab. Volte em breve!</div></div>`;
  const gravei = State.sugestoes.filter(s=> State.minhas[s.id]?.status==='gravei').length;
  const quero = State.sugestoes.filter(s=> State.minhas[s.id]?.status==='quero').length;
  const filtros = [['todas','Todas', State.sugestoes.length], ...(ideiasIa().length ? [['ia','✨ Da IA', ideiasIa().length]] : []), ['quero','🙋 Minha lista', quero], ['gravei','✅ Já gravei', gravei],
    ...Object.entries(SUGESTAO_TIPOS).map(([k,t])=>[k, `${t.emoji} ${t.curto||t.label}`, State.sugestoes.filter(s=>s.tipo===k).length]).filter(f=>f[2])];
  const lista = State.filtro==='ia' ? ideiasIa().map(ideiaIaComoSugestao) : State.sugestoes.filter(s=> State.filtro==='todas' ? true : State.filtro==='quero' || State.filtro==='gravei' ? State.minhas[s.id]?.status===State.filtro : s.tipo===State.filtro);
  return `
  <div class="page-head"><div><h1>Ideias pra gravar</h1><div class="sub">Sugestões da FourLab além dos seus roteiros do mês. Escolha uma, grave do seu jeito e marque aqui quando postar.</div></div>
    ${State.sugestoes.length ? `<div class="card" style="padding:14px 18px; display:flex; gap:22px; align-items:center;">
      <div><div style="font-size:26px; font-weight:700; font-family:var(--font-title);">${gravei}</div><div style="font-size:11.5px; color:var(--muted);">gravadas</div></div>
      <div><div style="font-size:26px; font-weight:700; font-family:var(--font-title);">${quero}</div><div style="font-size:11.5px; color:var(--muted);">na sua lista</div></div></div>` : ''}</div>
  ${cardIaHtml()}
  ${iaLiberada() ? `<div class="panel"><div class="card-head"><div><h2>Gerador de ganchos</h2><div class="desc">A frase dos primeiros 3 segundos, que prende quem está rolando o feed. Cada geração conta como 1 das suas ideias do mês.</div></div></div>${ganchosFormHtml(State.produtos)}</div>` : ''}
  ${State.sugestoes.length || ideiasIa().length ? `<div class="filter-pills" style="margin-bottom:16px;">${filtros.map(([k,l,n])=>`<button class="fpill ${State.filtro===k?'active':''}" data-filtro="${k}">${l} <span class="count">${n}</span></button>`).join('')}</div>` : ''}
  ${lista.length ? `<div class="sug-grid">${lista.map(s=> s.ia ? sugestaoCardHtml(s, {extra: `<div class="sug-selo" style="background:var(--orange-soft); color:#b5480a;">✨ Criada pela IA${s.avaliacao==='bom'?' · 👍':s.avaliacao==='ruim'?' · 👎':''}</div>`}).replace('data-abrir-sugestao=','data-abrir-ia=') : sugestaoCardHtml(s, {extra: seloMinha(s)})).join('')}</div>`
    : `<div class="panel"><div class="empty-state"><div class="big">💡</div>${State.sugestoes.length ? (State.filtro==='quero' ? 'Abra uma ideia e toque em "Quero gravar" pra guardar aqui.' : State.filtro==='gravei' ? 'Quando gravar uma ideia, marque "Já gravei" nela.' : 'Nada aqui.') : 'Nenhuma ideia publicada ainda. Logo chegam sugestões novas!'}</div></div>`}`;
}

function render(){
  document.getElementById('main').innerHTML = view();
  document.querySelectorAll('[data-filtro]').forEach(b=> b.onclick = ()=>{ State.filtro = b.dataset.filtro; render(); });
  const pedir = document.getElementById('btnPedirIa'); if(pedir) pedir.onclick = abrirPedirIa;
  if(iaLiberada() && document.getElementById('gGerar')) ligarGanchosForm({ aoGerar:(d)=>{ if(d && !d.erro || d?.restantes != null){ State.pedidosIa.unshift({id:'g'+Date.now(), status:'ok', created_at:new Date().toISOString()}); const el = document.querySelector('#btnPedirIa')?.closest('.card')?.querySelector('div > div:last-child'); if(el) el.textContent = el.textContent.replace(/\d+ de (\d+) ideias/, `${iaRestantes()} de $1 ideias`); } } });
  document.querySelectorAll('[data-abrir-ia]').forEach(el=>{ el.onclick = ()=> abrirIdeiaIa(el.dataset.abrirIa); el.onkeydown = (e)=>{ if(e.key==='Enter') abrirIdeiaIa(el.dataset.abrirIa); }; });
  document.querySelectorAll('[data-abrir-sugestao]').forEach(el=>{
    el.onclick = ()=> abrirDetalhe(el.dataset.abrirSugestao);
    el.onkeydown = (e)=>{ if(e.key==='Enter') abrirDetalhe(el.dataset.abrirSugestao); };
  });
}

function acoesHtml(s){
  const g = State.minhas[s.id];
  if(g?.status==='gravei') return `<div style="background:var(--green-soft); border-radius:14px; padding:12px 14px; font-size:13px; color:var(--green);">
      ✅ <strong>Você gravou esta ideia.</strong>${g.link?` <a href="${escHtml(g.link)}" target="_blank" rel="noopener" style="color:var(--green); word-break:break-all;">Ver post</a>`:''}
      <div class="row" style="gap:8px; margin-top:8px;"><button class="btn btn-ghost btn-sm" id="btnEditarLink">${g.link?'Trocar link':'Adicionar link do post'}</button><button class="btn btn-ghost btn-sm" id="btnDesmarcar">Desmarcar</button></div></div>`;
  return `<div id="boxGravei" style="display:none; margin-bottom:10px;">
      <div class="field" style="margin-bottom:8px;"><label>Link do post (opcional)</label><input id="linkPost" inputmode="url" placeholder="https://www.instagram.com/..."></div>
      <button class="btn btn-primary" id="btnConfirmarGravei" style="width:100%;">Confirmar que gravei</button></div>
    <div class="row" style="gap:8px;" id="boxBotoes">
      <button class="btn ${g?'btn-outline':'btn-ghost'}" id="btnQuero" style="flex:1;">${g ? '🙋 Na sua lista · tirar' : '🙋 Quero gravar'}</button>
      <button class="btn btn-primary" id="btnGravei" style="flex:1;">✅ Já gravei</button></div>`;
}

async function marcar(s, status, link){
  const atual = State.minhas[s.id];
  const row = { sugestao_id:s.id, athlete_id:State.athlete.id, status, link: link ?? atual?.link ?? '', updated_at:new Date().toISOString() };
  const res = atual ? await sb.from('sugestao_gravacoes').update(row).eq('id', atual.id).select().single()
                    : await sb.from('sugestao_gravacoes').insert(row).select().single();
  if(res.error){ erroBanco(res.error, MIGRACAO); return false; }
  State.minhas[s.id] = res.data; return true;
}
async function desmarcar(s){
  const atual = State.minhas[s.id]; if(!atual) return true;
  const { error } = await sb.from('sugestao_gravacoes').delete().eq('id', atual.id);
  if(error){ erroBanco(error, MIGRACAO); return false; }
  delete State.minhas[s.id]; return true;
}

function abrirDetalhe(id){
  const s = State.sugestoes.find(x=>x.id===id); if(!s) return;
  openModal(`<button class="modal-close" id="modalCloseBtn">&times;</button>
    ${sugestaoDetalheHtml(s)}
    <div style="margin-top:20px; border-top:1px solid #f3eee8; padding-top:16px;" id="acoesSug">${acoesHtml(s)}</div>`, {largo:true});
  document.getElementById('modalCloseBtn').onclick = closeModal;
  document.querySelectorAll('[data-copiar-roteiro-sug]').forEach(b=> b.onclick = ()=> navigator.clipboard.writeText(s.roteiro||'').then(()=> toast('Roteiro copiado')));
  ligarAcoes(s);
}
function ligarAcoes(s){
  const atualizar = ()=>{ document.getElementById('acoesSug').innerHTML = acoesHtml(s); ligarAcoes(s); render(); };
  const ocupado = (btn)=>{ btn.disabled = true; btn.innerHTML = '<span class="loader"></span>'; };
  const q = document.getElementById('btnQuero');
  if(q) q.onclick = async ()=>{ ocupado(q); const ok = State.minhas[s.id] ? await desmarcar(s) : await marcar(s, 'quero');
    if(ok) toast(State.minhas[s.id] ? 'Guardada na sua lista' : 'Tirada da sua lista'); atualizar(); };
  const g = document.getElementById('btnGravei');
  if(g) g.onclick = ()=>{ document.getElementById('boxGravei').style.display = ''; document.getElementById('boxBotoes').style.display = 'none'; document.getElementById('linkPost').focus(); };
  const c = document.getElementById('btnConfirmarGravei');
  if(c) c.onclick = async ()=>{ const link = document.getElementById('linkPost').value.trim(); ocupado(c);
    if(await marcar(s, 'gravei', link)) toast('Boa! Marcado como gravado 🎉'); atualizar(); };
  const d = document.getElementById('btnDesmarcar');
  if(d) d.onclick = async ()=>{ ocupado(d); if(await desmarcar(s)) toast('Desmarcado'); atualizar(); };
  const e = document.getElementById('btnEditarLink');
  if(e) e.onclick = async ()=>{ const link = prompt('Link do post:', State.minhas[s.id]?.link || ''); if(link===null) return;
    ocupado(e); if(await marcar(s, 'gravei', link.trim())) toast('Link salvo'); atualizar(); };
}

(async function start(){
  const auth = await guardAthlete('ideias'); if(!auth) return;
  State.athlete = auth.athlete;
  if(!State.athlete){ document.getElementById('main').innerHTML = '<div class="panel">Nenhum cadastro vinculado a este login.</div>'; return; }
  await carregar();
  render();
})();
</script></body></html>
