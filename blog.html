<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog (parceiros) · FourLab</title>
<meta name="description" content="Painel FourLab para atletas e parceiros: roteiros de conteúdo, vendas do cupom e perfil em um só lugar.">
<meta name="theme-color" content="#140e10">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="FourLab">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FourLab">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Painel dos atletas FourLab">
<meta property="og:description" content="Seus roteiros, suas vendas e seu cupom em um só lugar.">
<meta property="og:url" content="https://lucianowganan.github.io/fourlab-roteiros/">
<meta property="og:image" content="https://lucianowganan.github.io/fourlab-roteiros/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Painel dos atletas FourLab">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://lucianowganan.github.io/fourlab-roteiros/assets/og-image.jpg">
<link rel="stylesheet" href="shared.css"></head><body>
<div class="shell" id="appShell"><div id="sidebarMount"></div>
<main id="main"><div class="empty-state"><span class="loader" style="border-top-color:var(--orange);border-color:rgba(0,0,0,0.1);"></span></div></main></div>
<div id="modalBg" class="modal-bg"><div id="modalBox" class="modal-box"></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
/* Blog dos profissionais parceiros: cada profissional recebe uma pauta por mês
   (tema do mês — o mesmo dos atletas — ou um tema específico), escreve o texto
   na área dele e envia pra revisão aqui. */
const State = { ym: monthKey(todayISO()), temaMes:'', profissionais:[], pautas:[], filtro:'todos', tabelaOk:true };

function ultimoDiaDoMes(ym){ const [y,m] = ym.split('-').map(Number); return `${ym}-${String(new Date(y, m, 0).getDate()).padStart(2,'0')}`; }
function profById(id){ return State.profissionais.find(a=>a.id===id); }

async function carregar(){
  const [cyc, ath, pau] = await Promise.all([
    sb.from('cycles').select('theme_geral').eq('ym', State.ym).maybeSingle(),
    sb.from('athletes').select('*').order('name'),
    sb.from('blog_textos').select('*').eq('ym', State.ym),
  ]);
  State.temaMes = cyc.data?.theme_geral || '';
  State.profissionais = (ath.data||[]).map(mapAthleteFromDB).filter(isProfissional);
  State.tabelaOk = !pau.error;
  State.pautas = pau.data || [];
}

function view(){
  if(!State.tabelaOk) return `<div class="page-head"><div><h1>Blog (parceiros)</h1></div></div>
    <div class="panel"><div class="empty-state"><div class="big">🛠️</div>Rode <code>migrations/2026-09-28_blog_avisos.sql</code> no SQL Editor do Supabase e recarregue.</div></div>`;
  const semPauta = State.profissionais.filter(a=> !State.pautas.some(p=>p.athlete_id===a.id));
  const cont = st=> State.pautas.filter(p=>p.status===st).length;
  const filtros = [['todos','Todos',State.pautas.length],['enviado','Pra revisar',cont('enviado')],['ajustes','Ajustes pedidos',cont('ajustes')],['pendentes','Sem texto',cont('pendente')+cont('rascunho')],['aprovado','Aprovados',cont('aprovado')+cont('publicado')]];
  const lista = State.pautas.filter(p=> State.filtro==='todos' ? true : State.filtro==='pendentes' ? ['pendente','rascunho'].includes(p.status) : State.filtro==='aprovado' ? ['aprovado','publicado'].includes(p.status) : p.status===State.filtro)
    .sort((a,b)=> (b.status==='enviado') - (a.status==='enviado') || (profById(a.athlete_id)?.name||'').localeCompare(profById(b.athlete_id)?.name||''));
  const kpi = (label, v, sub)=> `<div class="card kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${v}</div>${sub?`<div class="kpi-foot"><span>${sub}</span></div>`:''}</div>`;

  return `
  <div class="page-head">
    <div><h1>Blog dos parceiros</h1><div class="sub">Pautas do mês pros profissionais parceiros escreverem os textos do blog — e a revisão de cada texto.</div></div>
    <div class="input-ic"><span class="ic">${ICONS.calendar}</span><input type="month" id="blogMes" value="${State.ym}" style="width:auto; background:#fff;"></div>
  </div>

  <div class="panel" style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
    <span class="ic-bubble" style="color:var(--orange);">${ICONS.blog}</span>
    <div style="flex:1; min-width:220px;"><div style="font-size:12px; color:var(--muted); font-weight:600;">Tema do mês · ${fmtMonthLabel(State.ym)} (o mesmo dos atletas)</div>
      <div style="font-size:17px; font-weight:700; font-family:var(--font-title); margin-top:2px;">${State.temaMes ? escHtml(State.temaMes) : '<span style="color:var(--muted); font-weight:500;">Ainda sem tema — defina em Mês / Roteiros</span>'}</div></div>
    <a class="btn btn-ghost btn-sm" href="ciclo.html">Editar tema em Mês / Roteiros</a>
    ${State.pautas.some(p=> !p.tema_especifico && (p.tema_mes||'') !== State.temaMes) ? `<button class="btn btn-ghost btn-sm" id="btnSyncTema">Atualizar pautas com este tema</button>` : ''}
  </div>

  <div class="grid-4" style="margin-bottom:18px;">
    ${kpi('Profissionais parceiros', State.profissionais.length)}
    ${kpi('Pautas do mês', State.pautas.length, semPauta.length ? `${semPauta.length} sem pauta` : 'todos com pauta')}
    ${kpi('Pra revisar', cont('enviado'), 'textos enviados')}
    ${kpi('Aprovados', cont('aprovado')+cont('publicado'), `${cont('publicado')} publicado(s)`)}
  </div>

  ${semPauta.length ? `<div class="panel" style="display:flex; align-items:center; gap:14px; padding:14px 18px;">
    <span class="ic-bubble" style="color:var(--orange);">${ICONS.plus}</span>
    <div style="flex:1; font-size:13px;"><strong>${semPauta.length} profissional(is)</strong> ainda sem pauta em ${fmtMonthLabel(State.ym)}: ${semPauta.slice(0,4).map(a=>escHtml(a.name)).join(', ')}${semPauta.length>4?'…':''}</div>
    <button class="btn btn-primary btn-sm" id="btnCriarPautas">Criar pautas com o tema do mês</button></div>` : ''}
  ${!State.profissionais.length ? `<div class="panel"><div class="empty-state">Nenhum profissional parceiro cadastrado. Cadastre em <a href="atletas.html" style="color:var(--orange);">Atletas & parceiros → Profissionais parceiros</a>.</div></div>` : ''}

  ${State.pautas.length ? `
  <div class="filter-pills" style="margin-bottom:14px;">${filtros.map(([k,l,n])=>`<button class="fpill ${State.filtro===k?'active':''}" data-filtro="${k}">${l} <span class="count">${n}</span></button>`).join('')}</div>
  <div class="panel" style="overflow-x:auto;"><table><thead><tr><th>Profissional</th><th>Tema</th><th>Prazo</th><th>Status</th><th>Texto</th><th></th></tr></thead><tbody>
    ${lista.map(p=>{ const a = profById(p.athlete_id)||{name:'(removido)'}; const atrasado = p.prazo && p.prazo < todayISO() && ['pendente','rascunho','ajustes'].includes(p.status);
      return `<tr data-abrir="${p.id}" style="cursor:pointer;">
        <td><div class="cell-person">${avatarHtml(a.name,'sm')}<div><strong>${escHtml(a.name)}</strong><div class="sub">${escHtml(a.profissao||a.team||'')}</div></div></div></td>
        <td style="max-width:280px;">${escHtml(blogTema(p))}${p.tema_especifico?' <span class="chip static" style="font-size:10px; padding:2px 8px;">específico</span>':''}</td>
        <td style="${atrasado?'color:var(--red); font-weight:700;':''}">${p.prazo?fmtDateBR(p.prazo):'—'}${atrasado?' · atrasado':''}</td>
        <td>${blogStatusHtml(p.status)}</td>
        <td style="color:var(--muted);">${p.texto ? `${fmtNum(contarPalavras(p.texto))} palavras` : '—'}</td>
        <td style="text-align:right;"><button class="icon-btn" data-abrir="${p.id}">${ICONS.arrow}</button></td></tr>`; }).join('')}
    ${!lista.length ? '<tr><td colspan="6"><div class="empty-state" style="padding:20px;">Nada aqui.</div></td></tr>' : ''}
  </tbody></table></div>` : ''}`;
}

/* ---------- Ficha da pauta: tema/prazo + revisão do texto ---------- */
function pautaDrawerHtml(p){
  const a = profById(p.athlete_id)||{name:'(removido)'};
  const podeRevisar = ['enviado','ajustes','aprovado','publicado'].includes(p.status) && p.texto;
  return `
  <div class="row" style="justify-content:space-between;"><button class="icon-btn" onclick="closeDrawer()">${ICONS.back}</button>${blogStatusHtml(p.status)}</div>
  <div class="row" style="gap:12px; margin:18px 0 6px;">${avatarHtml(a.name,'lg')}<div><div style="font-size:19px; font-weight:700; font-family:var(--font-title);">${escHtml(a.name)}</div>
    <div style="font-size:12.5px; color:var(--muted);">${escHtml(a.profissao||'Profissional parceiro')} · ${fmtMonthLabel(p.ym)}</div></div></div>

  <div class="section-title">Pauta</div>
  <div class="field"><label>Tema do mês</label><input value="${escHtml(p.tema_mes||State.temaMes||'')}" disabled style="opacity:0.75;"></div>
  <div class="field"><label>Tema específico pra esta pessoa (opcional — substitui o tema do mês)</label><input id="pTemaEsp" value="${escHtml(p.tema_especifico||'')}" placeholder="Ex: Hidratação em provas longas no calor"></div>
  <div class="field"><label>Orientações</label><textarea id="pOrient" style="min-height:80px;" placeholder="Tamanho, pontos que precisam aparecer, links, produto a citar...">${escHtml(p.orientacoes||'')}</textarea></div>
  <div class="row" style="align-items:flex-end;"><div class="field" style="flex:1; margin:0;"><label>Prazo</label><input type="date" id="pPrazo" value="${p.prazo||''}"></div>
    <button class="btn btn-ghost btn-sm" id="btnSalvarPauta" style="margin-bottom:2px;">Salvar pauta</button></div>

  <div class="section-title" style="margin-top:22px;">Texto ${p.enviado_em?`<span style="text-transform:none; font-weight:600;">· enviado em ${new Date(p.enviado_em).toLocaleString('pt-BR')}</span>`:''}</div>
  ${p.texto ? `<div style="background:var(--surface-2); border-radius:14px; padding:16px;">
      ${p.titulo?`<div style="font-size:17px; font-weight:700; font-family:var(--font-title); margin-bottom:8px;">${escHtml(p.titulo)}</div>`:''}
      <div style="font-size:13.5px; line-height:1.65; white-space:pre-wrap; max-height:46vh; overflow:auto;">${escHtml(p.texto)}</div>
      <div class="row" style="justify-content:space-between; margin-top:10px;"><span style="font-size:11.5px; color:var(--muted);">${fmtNum(contarPalavras(p.texto))} palavras${p.status==='rascunho'?' · rascunho (ainda não enviado)':''}</span>
        <button class="btn btn-ghost btn-sm" id="btnCopiarTexto">${ICONS.copy.replace('width="18" height="18"','width="13" height="13"')} Copiar</button></div></div>`
    : '<div style="font-size:12.5px; color:var(--muted);">Ainda sem texto.</div>'}

  ${podeRevisar ? `<div class="section-title" style="margin-top:22px;">Revisão</div>
  <div class="field"><label>Retorno pro profissional (aparece pra ele quando você pedir ajustes)</label><textarea id="pFeedback" style="min-height:90px;" placeholder="O que ajustar...">${escHtml(p.feedback||'')}</textarea></div>
  <div class="row" style="gap:8px;">
    <button class="btn btn-danger btn-sm" data-status="ajustes">Pedir ajustes</button>
    <button class="btn btn-primary btn-sm" data-status="aprovado">Aprovar</button>
    <button class="btn btn-ghost btn-sm" data-status="publicado">Marcar como publicado</button>
  </div>` : ''}
  <div style="border-top:1px solid #f3eee8; margin-top:24px; padding-top:14px;"><button class="btn btn-danger btn-sm" id="btnExcluirPauta">Excluir pauta</button></div>`;
}
function abrirPauta(id){
  const p = State.pautas.find(x=>x.id===id); if(!p) return;
  openDrawer(pautaDrawerHtml(p));
  const salvar = async (campos, msg)=>{
    const { error } = await sb.from('blog_textos').update({...campos, updated_at:new Date().toISOString()}).eq('id', p.id);
    if(error){ console.error(error); toast('Erro ao salvar'); return false; }
    Object.assign(p, campos); toast(msg); render(); abrirPauta(p.id); return true;
  };
  document.getElementById('btnSalvarPauta').onclick = ()=> salvar({ tema_especifico:document.getElementById('pTemaEsp').value.trim(),
    orientacoes:document.getElementById('pOrient').value.trim(), prazo:document.getElementById('pPrazo').value||null }, 'Pauta salva');
  const cp = document.getElementById('btnCopiarTexto'); if(cp) cp.onclick = ()=> navigator.clipboard.writeText((p.titulo?p.titulo+'\n\n':'')+p.texto).then(()=>toast('Texto copiado'));
  document.querySelectorAll('#drawer [data-status]').forEach(b=> b.onclick = ()=>{
    const st = b.dataset.status, feedback = document.getElementById('pFeedback').value.trim();
    if(st==='ajustes' && !feedback){ toast('Escreva o que precisa ajustar'); return; }
    salvar({status:st, feedback}, st==='ajustes' ? 'Ajustes pedidos' : st==='aprovado' ? 'Texto aprovado' : 'Marcado como publicado');
  });
  document.getElementById('btnExcluirPauta').onclick = async ()=>{
    if(!confirm('Excluir esta pauta (e o texto, se houver)?')) return;
    const { error } = await sb.from('blog_textos').delete().eq('id', p.id);
    if(error){ toast('Erro ao excluir'); return; }
    State.pautas = State.pautas.filter(x=>x.id!==p.id); closeDrawer(); toast('Pauta excluída'); render();
  };
}

function render(){
  document.getElementById('main').innerHTML = view();
  if(!State.tabelaOk) return;
  document.getElementById('blogMes').onchange = async (e)=>{ if(!e.target.value) return; State.ym = e.target.value; await carregar(); render(); };
  document.querySelectorAll('[data-filtro]').forEach(b=> b.onclick = ()=>{ State.filtro = b.dataset.filtro; render(); });
  document.querySelectorAll('[data-abrir]').forEach(el=> el.onclick = (ev)=>{ ev.stopPropagation(); abrirPauta(el.dataset.abrir); });
  const criar = document.getElementById('btnCriarPautas');
  if(criar) criar.onclick = async ()=>{
    const rows = State.profissionais.filter(a=> !State.pautas.some(p=>p.athlete_id===a.id))
      .map(a=>({ athlete_id:a.id, ym:State.ym, tema_mes:State.temaMes, prazo:ultimoDiaDoMes(State.ym) }));
    criar.disabled = true;
    const { data, error } = await sb.from('blog_textos').insert(rows).select();
    if(error){ console.error(error); toast('Erro ao criar pautas'); criar.disabled = false; return; }
    State.pautas.push(...(data||[])); toast(`${rows.length} pauta(s) criada(s)`); render();
  };
  const sync = document.getElementById('btnSyncTema');
  if(sync) sync.onclick = async ()=>{
    const alvo = State.pautas.filter(p=> !p.tema_especifico);
    await Promise.all(alvo.map(p=> sb.from('blog_textos').update({tema_mes:State.temaMes}).eq('id', p.id)));
    alvo.forEach(p=> p.tema_mes = State.temaMes); toast('Pautas atualizadas'); render();
  };
}

(async function start(){
  const auth = await guardStaff('blog'); if(!auth) return;
  await carregar();
  render();
})();
</script></body></html>
